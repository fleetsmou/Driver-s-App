<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Sumou Fleet — Driver Telemetry HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --sans:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;
    --display:'Outfit',-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    /* Formula Telemetry HUD — Carbon Graphite & Warm Amber */
    --bg-page:#0a0b0f; --card-bg:#12141a; --card-inner:#181a22; --tile-bg:#0d0f15;
    --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.14); --border-accent:rgba(245,158,11,.4);
    --amber:#f59e0b; --amber-2:#fbbf24; --amber-glow:rgba(245,158,11,.28); --amber-tint:rgba(245,158,11,.12);
    --green:#10b981; --green-ink:#34d399; --green-tint:rgba(16,185,129,.14);
    --blue:#3b82f6; --blue-ink:#60a5fa; --blue-tint:rgba(37,99,235,.14);
    --violet:#a78bfa; --violet-tint:rgba(167,139,250,.14);
    --txt-white:#f8fafc; --txt-muted:#94a3b8; --txt-dim:#64748b;
    --red-bg:rgba(239,68,68,.12); --red-border:rgba(239,68,68,.35); --red-txt:#fca5a5; --red:#ef4444;
    --shadow:0 4px 20px rgba(0,0,0,.4); --shadow2:0 10px 40px rgba(0,0,0,.7);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;min-height:100vh;min-height:100dvh;background:var(--bg-page);color:var(--txt-white);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  body{display:flex;flex-direction:column;align-items:center;}
  .hidden{display:none !important;}

  /* ---------- SVG icons ---------- */
  svg.i{display:inline-block;vertical-align:middle;width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  svg.i-xs{width:13px;height:13px;stroke-width:2;}
  svg.i-lg{width:20px;height:20px;}

  /* ---------- buttons / inputs ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-family:var(--mono);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--card-inner);color:var(--txt-white);transition:.18s;}
  .btn:active{transform:scale(.97);}
  .btn-amber{background:linear-gradient(135deg,var(--amber-2),#d97706);color:#0c0d12;border:none;box-shadow:0 4px 16px var(--amber-glow);font-weight:900;}
  .btn-blue{background:#2563eb;border-color:#3b82f6;color:#fff;}
  .btn-blue:hover{background:#1d4ed8;}
  .btn-ghost{background:var(--tile-bg);}
  .btn-ghost:hover{border-color:var(--border-accent);}
  .btn-red{background:var(--red-bg);border-color:var(--red-border);color:var(--red-txt);}
  .btn-red:hover{background:rgba(239,68,68,.22);}
  .btn-block{width:100%;}
  input,select,textarea{width:100%;height:42px;background:var(--tile-bg);border:1px solid var(--border);border-radius:10px;padding:0 12px;color:var(--txt-white);font-family:var(--mono);font-size:13.5px;outline:none;transition:.18s;}
  textarea{height:auto;padding:10px 12px;font-family:var(--sans);}
  input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-glow);}
  input::placeholder{color:var(--txt-dim);}
  select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--txt-dim) 50%),linear-gradient(135deg,var(--txt-dim) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;}
  label.fld{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;font-family:var(--mono);color:var(--txt-dim);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px;}
  label.fld:first-child{margin-top:0;}
  .fhint{font-size:11px;color:var(--txt-dim);margin-top:6px;font-family:var(--mono);}

  /* ---------- loading / toast ---------- */
  #app{width:100%;display:flex;flex-direction:column;align-items:center;flex:1;}
  .loading{display:grid;place-items:center;min-height:80vh;color:var(--txt-muted);text-align:center;font-family:var(--mono);font-size:13px;width:100%;}
  .spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#181b24;border:1px solid var(--amber);color:#fff;padding:10px 18px;border-radius:22px;font-size:12.5px;font-weight:700;font-family:var(--mono);box-shadow:var(--shadow2);z-index:3000;pointer-events:none;transition:.28s cubic-bezier(.16,1,.3,1);max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ============================================================ DRIVER COCKPIT ============================================================ */
  .cockpit{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;gap:8px;position:relative;
    padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}
  @media(min-width:520px){
    body{justify-content:flex-start;padding:16px 0 40px;}
    .cockpit{min-height:auto;border:1px solid var(--border);border-radius:24px;background:var(--card-bg);box-shadow:var(--shadow2);padding:14px 16px;margin-bottom:14px;}
  }
  .header-bar{display:flex;align-items:center;justify-content:space-between;padding-bottom:7px;border-bottom:1px solid var(--border);}
  .brand-side{display:flex;align-items:center;gap:8px;}
  .brand-icon{width:32px;height:32px;border-radius:10px;background:#1e222d;border:1px solid var(--border-accent);color:var(--amber);display:grid;place-items:center;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
  .brand-title{font-family:var(--display);font-weight:900;font-size:14px;line-height:1.1;letter-spacing:.3px;display:flex;align-items:center;gap:5px;}
  .hud-badge{font-family:var(--mono);font-size:9px;font-weight:800;color:var(--amber);background:var(--amber-tint);border:1px solid var(--border-accent);padding:1px 5px;border-radius:5px;}
  .driver-sub{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt-muted);margin-top:2px;}
  .driver-sub .dn{font-weight:700;color:#e2e8f0;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{opacity:.6}50%{opacity:1;transform:scale(1.1)}100%{opacity:.6}}
  .header-actions{display:flex;align-items:center;gap:6px;}
  .veh-chip{display:flex;align-items:center;gap:4px;padding:4px 7px;border-radius:8px;background:#181b24;border:1px solid var(--border);font-size:10.5px;color:var(--txt-muted);}
  .veh-chip b{font-family:var(--mono);color:var(--amber);}
  .btn-logout{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:9px;background:var(--red-bg);border:1px solid var(--red-border);color:var(--red-txt);font-size:11px;font-weight:700;font-family:var(--sans);cursor:pointer;white-space:nowrap;}
  .btn-logout:active{transform:scale(.95);}

  .dispatch-strip{background:#161820;border:1px solid var(--border);border-radius:12px;padding:5px 7px;display:flex;align-items:center;justify-content:space-between;}
  .dispatch-label{font-family:var(--mono);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-dim);display:flex;align-items:center;gap:5px;padding-left:3px;}
  .platform-btns{display:flex;gap:5px;}
  .btn-p{padding:5px 13px;border-radius:8px;border:1px solid var(--border);background:#11131a;color:var(--txt-muted);font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;transition:.18s;}
  .btn-p.active{background:var(--amber);color:#0d0e12;border-color:var(--amber);font-weight:800;box-shadow:0 2px 10px var(--amber-glow);}
  .btn-p.locked{opacity:.55;cursor:default;}

  .cockpit-card{background:var(--card-inner);border:1px solid var(--border);border-radius:16px;padding:9px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;}
  .twin-gauges{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .gauge-tile{background:var(--tile-bg);border:1px solid var(--border);border-radius:12px;padding:9px;cursor:pointer;transition:.2s;position:relative;}
  .gauge-tile:active{transform:scale(.98);}
  .gauge-tile.nolink{cursor:default;}
  .gauge-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--txt-dim);}
  .gauge-head .lbl{display:flex;align-items:center;gap:4px;}
  .gauge-head .lbl svg{color:var(--amber);}
  .gauge-head .edit-tag{color:var(--amber);font-size:9px;display:flex;align-items:center;gap:3px;}
  .gauge-value{font-family:var(--mono);font-size:19px;font-weight:900;color:var(--amber);margin-top:3px;display:flex;align-items:baseline;gap:3px;letter-spacing:-.5px;}
  .gauge-value small{font-size:10px;font-weight:700;color:var(--txt-muted);}
  .gauge-sub{font-size:9px;color:var(--txt-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);}

  .active-duty-banner{display:none;align-items:center;justify-content:space-between;background:rgba(245,158,11,.14);border:1px solid var(--border-accent);border-radius:9px;padding:5px 9px;font-family:var(--mono);font-size:10.5px;color:#fde68a;}
  .active-duty-banner.show{display:flex;}
  .banner-left{display:flex;align-items:center;gap:6px;font-weight:800;}
  .ping-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.4s infinite;}
  .timer-clock{font-weight:900;letter-spacing:.8px;color:#fff;}

  .btn-launch{width:100%;height:46px;border-radius:13px;border:none;font-family:var(--mono);font-size:13.5px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.22s;background:linear-gradient(135deg,var(--amber-2),#d97706);color:#0c0d12;box-shadow:0 4px 18px var(--amber-glow);}
  .btn-launch:active{transform:scale(.98);}
  .btn-launch.duty-on{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 4px 20px rgba(239,68,68,.45);}

  .telemetry-card{background:var(--card-inner);border:1px solid var(--border);border-radius:15px;padding:9px;display:flex;flex-direction:column;gap:7px;}
  .telemetry-title{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-dim);padding:0 2px;}
  .telemetry-title .dt{color:var(--amber);}
  .stats-triplet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
  .stat-pill{background:var(--tile-bg);border:1px solid var(--border);border-radius:11px;padding:7px 3px;text-align:center;}
  .stat-pill .label{font-size:9px;font-weight:600;color:var(--txt-muted);font-family:var(--mono);}
  .stat-pill .num{font-family:var(--mono);font-size:15.5px;font-weight:900;color:var(--txt-white);margin-top:1px;}
  .stat-pill.amber .num{color:var(--amber);}
  .stat-pill .num span{font-size:9px;font-weight:600;color:var(--txt-dim);}
  .stat-pill .sub-tag{font-size:8.5px;font-family:var(--mono);color:var(--txt-dim);}
  .micro-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .btn-micro{height:33px;border-radius:9px;border:1px solid var(--border);background:var(--tile-bg);color:var(--txt-white);font-family:var(--mono);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:.18s;}
  .btn-micro:active{transform:scale(.97);}
  .btn-micro.fuel{background:var(--amber-tint);border-color:var(--border-accent);color:var(--amber);}

  .trail-card{background:var(--card-inner);border:1px solid var(--border);border-radius:15px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;flex:1;}
  .trail-header{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;}
  .trail-title{display:flex;align-items:center;gap:5px;color:var(--txt-white);}
  .trail-title svg{color:var(--amber);}
  .trail-badge{font-family:var(--mono);font-size:8.5px;font-weight:800;background:var(--amber-tint);border:1px solid var(--border-accent);color:var(--amber);padding:1px 6px;border-radius:10px;}
  .trail-badge.live{background:var(--green-tint);border-color:rgba(16,185,129,.4);color:var(--green-ink);}
  .waypoints-box{background:var(--tile-bg);border:1px solid var(--border);border-radius:11px;padding:8px 10px;font-family:var(--mono);font-size:10px;display:flex;flex-direction:column;justify-content:space-around;gap:6px;flex:1;}
  .wp-point{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .wp-point .point-info{display:flex;align-items:center;gap:5px;color:var(--txt-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wp-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0;}
  .wp-dot.green{background:var(--green);}
  .wp-dot.orange{background:#fb923c;}
  .wp-km{font-weight:700;color:var(--txt-white);white-space:nowrap;margin-left:auto;}
  .wp-km.hl{color:var(--amber);}
  .wp-connector{font-size:9px;color:var(--txt-dim);padding-left:11px;border-left:2px dashed rgba(255,255,255,.1);margin-left:2px;}
  .trail-footer{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);padding-top:2px;}
  .trail-footer b{color:var(--amber);}
  .trail-footer .lf{display:flex;align-items:center;gap:4px;}
  .trail-footer .lf svg{color:var(--amber);}

  /* ---------- driver history ---------- */
  .history{width:100%;max-width:480px;padding:0 max(12px,env(safe-area-inset-left)) 26px;display:flex;flex-direction:column;gap:8px;}
  @media(min-width:520px){.history{padding:0;}}
  .pilltabs{display:inline-flex;gap:6px;background:var(--tile-bg);border:1px solid var(--border);border-radius:11px;padding:5px;}
  .pilltabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:0;color:var(--txt-muted);padding:8px 10px;border-radius:8px;font-size:11px;font-weight:700;font-family:var(--mono);cursor:pointer;}
  .pilltabs button.active{background:var(--amber);color:#0d0e12;}
  .rec{background:var(--card-inner);border:1px solid var(--border);border-radius:13px;padding:11px;}
  .rec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap;}
  .rec-title{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--txt-white);flex-wrap:wrap;}
  .tag-plate{font-family:var(--mono);font-size:10px;font-weight:700;background:#181b24;color:var(--txt-muted);border:1px solid var(--border);padding:1px 6px;border-radius:6px;letter-spacing:.5px;}
  .st-badge{font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:10px;text-transform:uppercase;}
  .st-active{background:var(--green-tint);color:var(--green-ink);border:1px solid rgba(16,185,129,.4);}
  .st-done{background:#181b24;color:var(--txt-muted);border:1px solid var(--border);}
  .rec-meta{font-family:var(--mono);font-size:10.5px;color:var(--txt-muted);display:flex;flex-direction:column;gap:3px;}
  .rec-meta .row{display:flex;align-items:center;gap:5px;}
  .rec-meta b{color:var(--txt-white);}
  .rec-meta .amber{color:var(--amber);}

  /* ============================================================ AUTH GATES ============================================================ */
  .authgate{width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));}
  .authcard{width:100%;max-width:380px;background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow2);}
  .authbrand{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .authbrand .logo-box{width:44px;height:44px;border-radius:12px;background:#1e222d;border:1px solid var(--border-accent);color:var(--amber);display:grid;place-items:center;box-shadow:0 4px 14px var(--amber-glow);}
  .authbrand .ab-text b{font-family:var(--display);font-size:17px;font-weight:900;color:var(--txt-white);letter-spacing:.5px;display:block;line-height:1.2;}
  .authbrand .ab-text small{font-family:var(--mono);font-size:10px;color:var(--amber);font-weight:700;letter-spacing:.5px;}
  .authcard h2{font-family:var(--display);font-size:18px;font-weight:800;color:var(--txt-white);margin-bottom:4px;}
  .authsub{font-size:11.5px;color:var(--txt-muted);margin-bottom:16px;line-height:1.5;}
  .authnote{text-align:center;font-size:10.5px;color:var(--txt-dim);margin-top:14px;font-family:var(--mono);}
  .autherr{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red-txt);padding:8px 10px;border-radius:8px;font-size:11px;margin-bottom:12px;}
  .infobox{background:var(--amber-tint);border:1px solid var(--border-accent);color:#fbd38d;border-radius:10px;padding:11px;font-size:11.5px;line-height:1.5;margin-bottom:14px;display:flex;gap:8px;}
  .infobox svg{color:var(--amber);margin-top:1px;}

  /* ============================================================ ADMIN PORTAL ============================================================ */
  .admin{width:100%;max-width:1160px;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:13px;margin:0 auto;}
  .admin-appbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card-bg);border:1px solid var(--border);border-radius:16px;gap:10px;flex-wrap:wrap;}
  .admin-brand{display:flex;align-items:center;gap:10px;}
  .admin-brand .logo-box{width:38px;height:38px;border-radius:11px;background:#172554;border:1px solid rgba(59,130,246,.5);color:var(--blue-ink);display:grid;place-items:center;}
  .admin-brand .t b{font-family:var(--display);font-size:16px;font-weight:900;letter-spacing:.4px;display:inline;}
  .admin-badge{font-family:var(--mono);font-size:9.5px;font-weight:800;color:var(--blue-ink);background:var(--blue-tint);border:1px solid rgba(59,130,246,.35);padding:2px 7px;border-radius:6px;margin-left:6px;}
  .admin-brand .t small{display:block;font-size:11px;color:var(--txt-muted);margin-top:2px;}
  .admin-appbar-r{display:flex;align-items:center;gap:10px;}
  .hstats{display:flex;align-items:center;gap:12px;background:var(--tile-bg);border:1px solid var(--border);border-radius:11px;padding:8px 14px;font-family:var(--mono);font-size:11px;color:var(--txt-muted);}
  .hstats b{color:#fff;}
  .hstats .gdot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);display:inline-block;margin-right:5px;}
  .hstats .sep{width:1px;height:14px;background:var(--border);}
  .admin-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px;}
  .admin-kpi{background:var(--card-inner);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
  .admin-kpi-t{font-family:var(--mono);font-size:10px;color:var(--txt-dim);text-transform:uppercase;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;}
  .admin-kpi-v{font-family:var(--mono);font-size:22px;font-weight:900;color:var(--txt-white);margin-top:6px;letter-spacing:-.5px;}
  .admin-kpi-v small{font-size:11px;color:var(--txt-muted);font-weight:600;}
  .admin-kpi-s{font-size:11px;color:var(--txt-muted);margin-top:3px;}
  .admin-kpi-s.green{color:var(--green-ink);}.admin-kpi-s.violet{color:var(--violet);}
  .kic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;}

/* ============================================================ DATA LAYER ============================================================ */
async function loadAll(){
  const [d,s,k,f]=await Promise.all([
    sb.from("drivers").select("*").order("created_at"),
    sb.from("shifts").select("*").order("created_at"),
    sb.from("km_records").select("*").order("created_at"),
    sb.from("fuel_records").select("*").order("created_at"),
  ]);
  if(d.error||s.error||k.error||f.error){console.error(d.error||s.error||k.error||f.error);throw (d.error||s.error||k.error||f.error);}
  state.drivers=(d.data||[]).map(mapDriver);
  state.shifts=(s.data||[]).map(mapShift);
  state.kmRecords=(k.data||[]).map(mapKm);
  state.fuelRecords=(f.data||[]).map(mapFuel);
}
function subscribeRealtime(){sb.channel("sumou-live").on("postgres_changes",{event:"*",schema:"public"},onRealtime).subscribe();}
function applyChange(table,ev,nw,oldRow){
  const cfg={drivers:["drivers",mapDriver],shifts:["shifts",mapShift],km_records:["kmRecords",mapKm],fuel_records:["fuelRecords",mapFuel]}[table];
  if(!cfg)return;const [arrName,mapper]=cfg;const arr=state[arrName];
  if(ev==="DELETE"){const id=oldRow&&oldRow.id;const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);return;}
  const row=mapper(nw);const i=arr.findIndex(x=>x.id===row.id);if(i>=0)arr[i]=row;else arr.push(row);
}
let renderT=null;
function scheduleRender(){clearTimeout(renderT);renderT=setTimeout(()=>{
  if($("#overlay"))return;const ae=document.activeElement;
  if(ae&&["INPUT","SELECT","TEXTAREA"].includes(ae.tagName))return;render();},450);}
function onRealtime(p){
  applyChange(p.table,p.eventType,p.new,p.old);
  const liveMove=p.table==="shifts"&&p.eventType==="UPDATE"&&p.new&&p.new.status==="ACTIVE"&&p.old&&p.old.status==="ACTIVE";
  if(state.screen==="admin"&&state.adminTab==="map"&&liveMove){refreshLiveMarkers();return;}
  if(state.screen==="driver"){updateDriverGps();}
  scheduleRender();
}

/* ============================================================ GPS ============================================================ */
async function reverseGeocode(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat=${lat}&lon=${lng}`,{headers:{"Accept":"application/json"}});
    const j=await r.json();const a=j.address||{};
    const place=a.neighbourhood||a.suburb||a.city_district||a.quarter||a.road||a.city||a.town||a.village||j.name||"Current Location";
    const city=a.city||a.town||a.state||"Kuwait";
    return {place,addr:j.display_name?j.display_name.split(",").slice(0,3).join(", "):`${place}, ${city}`};
  }catch(e){return {place:"Current Location",addr:`${(+lat).toFixed(5)}, ${(+lng).toFixed(5)}`};}
}
function detectGps(kind){
  if(!navigator.geolocation){toast("GPS not supported on this device — pick a Hub");return;}
  toast("Getting your GPS location…");
  const spin=$("#gpsSpin");if(spin){spin.style.transition="transform .6s linear";spin.style.transform="rotate(360deg)";}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lng,accuracy}=pos.coords;
    const g=await reverseGeocode(lat,lng);
    state.gps[kind]={place:g.place,addr:g.addr,lat:+lat.toFixed(5),lng:+lng.toFixed(5),acc:Math.max(1,Math.round(accuracy||15)),time:nowTime()};
    refreshGps(kind);toast("GPS locked ✓");
    if(spin)spin.style.transform="rotate(0deg)";
  },err=>{toast(err.code===1?"GPS permission denied — allow location or pick a Hub":"Couldn't get GPS — pick a Hub");if(spin)spin.style.transform="rotate(0deg)";},{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}
function setHubGps(kind,i){const h=HUBS[i];state.gps[kind]={place:h.name,addr:h.addr,lat:h.lat,lng:h.lng,acc:15,time:nowTime()};refreshGps(kind);toast("Hub location set ✓");}
function refreshGps(kind){const el=$("#"+kind+"Gps");if(el)el.innerHTML=gpsPickerMini(kind);if(kind==="login")updateDriverGps();}

/* driver cockpit GPS gauge + route card live update */
function updateDriverGps(){
  if(state.screen!=="driver")return;
  const n=$("#gpsName");if(!n)return;
  const a=$("#gpsAcc"),c=$("#gpsCoords"),tl=$("#trailLive");
  const sh=activeShift(state.driverId);
  if(sh){
    const lat=sh.liveLat??sh.loginLat,lng=sh.liveLng??sh.loginLng;
    n.textContent=sh.loginPlace||"On Duty";
    if(a)a.textContent=sh.speed?sh.speed+" km/h":"LIVE";
    if(c)c.textContent=lat!=null?`${Math.abs(lat).toFixed(4)}°${lat>=0?'N':'S'}, ${Math.abs(lng).toFixed(4)}°${lng>=0?'E':'W'}`:"streaming…";
    if(tl)tl.textContent="Live: "+(sh.loginPlace||"On road");
  }else if(state.gps.login){
    const g=state.gps.login;
    n.textContent=g.place;
    if(a)a.textContent=`±${g.acc}m Lock`;
    if(c)c.textContent=`${Math.abs(g.lat).toFixed(4)}°${g.lat>=0?'N':'S'}, ${Math.abs(g.lng).toFixed(4)}°${g.lng>=0?'E':'W'}`;
    if(tl)tl.textContent="Check-in: "+g.place;
  }
}

/* live position streaming while on duty — writes every 7s even if stationary */
let watchId=null,liveHb=null,lastGeo=null,lastPos=null,bgWatcherId=null;
function haversine(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dLat=r(c-a),dLng=r(d-b);const s=Math.sin(dLat/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
async function writeLive(shiftId,lat,lng){
  let kmh=0;
  if(lastPos){const dist=haversine(lastPos.lat,lastPos.lng,lat,lng);const dt=(Date.now()-lastPos.t)/1000;if(dt>0)kmh=Math.round((dist/dt)*3.6);}
  lastPos={lat,lng,t:Date.now()};
  try{await sb.from("shifts").update({live_lat:+lat.toFixed(5),live_lng:+lng.toFixed(5),speed:kmh,live_time:nowTime()}).eq("id",shiftId);}catch(e){}
  const sh=state.shifts.find(s=>s.id===shiftId);if(sh){sh.liveLat=+lat.toFixed(5);sh.liveLng=+lng.toFixed(5);sh.speed=kmh;sh.lastPing=nowTime();}
  if(state.screen==="driver")updateDriverGps();
}
function startLiveWatch(shiftId){
  stopLiveWatch();
  if(BGGeo){
    BGGeo.addWatcher({backgroundMessage:"Sumou Fleet is sharing your live location.",backgroundTitle:"On duty — GPS active",requestPermissions:true,stale:false,distanceFilter:8},
      (location,error)=>{if(error)return;if(location)writeLive(shiftId,location.latitude,location.longitude);})
      .then(id=>{bgWatcherId=id;}).catch(()=>startWebWatch(shiftId));
    return;
  }
  startWebWatch(shiftId);
}
function startWebWatch(shiftId){
  if(!navigator.geolocation){toast("This device can't share GPS.");return;}
  acquireWake();
  const opts={enableHighAccuracy:true,maximumAge:0,timeout:15000};
  navigator.geolocation.getCurrentPosition(p=>writeLive(shiftId,p.coords.latitude,p.coords.longitude),e=>{},opts);
  watchId=navigator.geolocation.watchPosition(p=>{lastGeo={lat:p.coords.latitude,lng:p.coords.longitude};},e=>{},opts);
  liveHb=setInterval(()=>{
    if(lastGeo){writeLive(shiftId,lastGeo.lat,lastGeo.lng);}
    else navigator.geolocation.getCurrentPosition(p=>writeLive(shiftId,p.coords.latitude,p.coords.longitude),e=>{},opts);
  },7000);
}
function stopLiveWatch(){
  if(BGGeo&&bgWatcherId){try{BGGeo.removeWatcher({id:bgWatcherId});}catch(e){}bgWatcherId=null;}
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  if(liveHb){clearInterval(liveHb);liveHb=null;}lastGeo=null;lastPos=null;releaseWake();}
function manualLive(shiftId){
  if(!navigator.geolocation)return;
  const spin=$("#gpsSpin");if(spin){spin.style.transition="transform .6s linear";spin.style.transform="rotate(360deg)";}
  toast("Refreshing live location…");
  navigator.geolocation.getCurrentPosition(p=>{writeLive(shiftId,p.coords.latitude,p.coords.longitude);if(spin)spin.style.transform="rotate(0deg)";},e=>{if(spin)spin.style.transform="rotate(0deg)";},{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}

let adminPoll=null;
function startAdminPoll(){stopAdminPoll();adminPoll=setInterval(async()=>{
  if(state.screen!=="admin")return;
  try{const {data}=await sb.from("shifts").select("*").eq("status","ACTIVE");
    if(data){data.forEach(r=>{const ms=mapShift(r);const i=state.shifts.findIndex(x=>x.id===ms.id);if(i>=0)state.shifts[i]=ms;else state.shifts.push(ms);});
      if(state.adminTab==="map")refreshLiveMarkers();}
  }catch(e){}
},5000);}
function stopAdminPoll(){if(adminPoll){clearInterval(adminPoll);adminPoll=null;}}

/* keep the driver's screen awake while on duty */
let wakeLock=null;
async function acquireWake(){try{if("wakeLock" in navigator){wakeLock=await navigator.wakeLock.request("screen");}}catch(e){}}
function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&state.screen==="driver"){
    const sh=activeShift(state.driverId);
    if(sh){acquireWake();if(lastGeo)writeLive(sh.id,lastGeo.lat,lastGeo.lng);}
  }
});

function render(){
  teardownMap();
  if(!state.ready)return;
  if(state.screen==="landing")app.innerHTML=viewLanding();
  else if(state.screen==="admin")app.innerHTML=viewAdmin();
  else if(state.screen==="driver")app.innerHTML=viewDriver();
  postRender();
}
let timerInt=null;
function postRender(){
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  if(state.screen==="driver"){
    const sh=activeShift(state.driverId);
    if(sh){timerInt=setInterval(()=>{const el=$("#liveTimer");if(!el)return;const m=Math.floor((Date.now()-sh.startedAt)/60000);el.textContent=`${Math.floor(m/60)}h ${m%60}m`;},1000);
      startLiveWatch(sh.id);} else stopLiveWatch();
    updateDriverGps();
  } else stopLiveWatch();
  if(state.screen==="admin"){if(state.adminTab==="map")mountMap();startAdminPoll();} else stopAdminPoll();
}

  const shiftCards=shifts.length?shifts.map(s=>`<div class="rec">
      <div class="rec-head"><div class="rec-title">${s.platform} Shift <span class="tag-plate">${d.plate}</span> <span class="st-badge ${s.status==="ACTIVE"?"st-active":"st-done"}">${s.status}</span></div></div>
      <div class="rec-meta">
        <div class="row">${ic('calendar','i-xs')} ${fmtDate(s.date)} · Duration <b>${s.duration||"0h 0m"}</b></div>
        <div class="row">${ic('login','i-xs')} In: <b>${s.loginPlace||"—"}</b> (${s.loginTime||"—"}) · ${km(s.startOdo)} KM</div>
        ${s.status==="ACTIVE"?`<div class="row" style="color:var(--amber)">${ic('nav','i-xs')} On road — logout location captured when duty ends</div>`
          :`<div class="row">${ic('logout','i-xs')} Out: <b>${s.logoutPlace||"—"}</b> (${s.logoutTime||"—"}) · ${km(s.endOdo)} KM</div><div class="row amber">${ic('chart','i-xs')} Distance +${s.distance!=null?s.distance:0} KM · Trips ${s.trips!=null?s.trips:"—"}</div>`}
      </div></div>`).join(""):emptyBox("No shifts yet — clock in above to start your first duty.");
  const fuelCards=fuel.length?fuel.map(r=>`<div class="rec">
      <div class="rec-head"><div class="rec-title">${r.station}</div><span class="st-badge st-active">${money(r.cost)} KWD</span></div>
      <div class="rec-meta">
        <div class="row">${ic('pin','i-xs')} ${r.place} · ${fmtDate(r.date)} ${r.time||""}</div>
        <div class="row">${ic('fuel','i-xs')} ${r.liters} L of ${r.fuelType} @ ${r.price} KWD/L · Odo ${km(r.odo)} KM</div>
      </div></div>`).join(""):emptyBox("No fuel records yet.");
  return `<div class="history">
    <div class="pilltabs"><button class="active" data-drtab="shifts">${ic('clock','i-xs')} Shifts (${shifts.length})</button><button data-drtab="fuel">${ic('fuel','i-xs')} Fuel (${fuel.length})</button></div>
    <div id="drShifts" style="display:flex;flex-direction:column;gap:8px">${shiftCards}</div>
    <div id="drFuel" class="hidden" style="flex-direction:column;gap:8px">${fuelCards}</div>
  </div>`;
}

function atab(id,label,icon,c){return `<button class="admin-tab ${state.adminTab===id?"active":""}" data-tab="${id}">${ic(icon,'i-xs')} ${label}${c!=null?` <span class="ct">(${c})</span>`:""}</button>`;}
function adminKpis(){return `<div class="admin-kpis">
  <div class="admin-kpi"><div class="admin-kpi-t"><span>Active On Duty</span><span class="kic green">${ic('nav','i-xs')}</span></div><div class="admin-kpi-v">${activeCount()} <small>/ ${state.drivers.length} drivers</small></div><div class="admin-kpi-s green">Currently streaming GPS live</div></div>
  <div class="admin-kpi"><div class="admin-kpi-t"><span>Total Fleet KMs</span><span class="kic blue">${ic('car','i-xs')}</span></div><div class="admin-kpi-v">${km(totalFleetKm())} <small>KM</small></div><div class="admin-kpi-s">Across all platforms</div></div>
  <div class="admin-kpi"><div class="admin-kpi-t"><span>Fuel Spend</span><span class="kic amber">${ic('fuel','i-xs')}</span></div><div class="admin-kpi-v">${money(totalFuelKwd())} <small>KWD</small></div><div class="admin-kpi-s">${totalLiters().toFixed(1)} L total pumped</div></div>
  <div class="admin-kpi"><div class="admin-kpi-t"><span>Shift Logs</span><span class="kic violet">${ic('pin','i-xs')}</span></div><div class="admin-kpi-v">${state.shifts.length} <small>Records</small></div><div class="admin-kpi-s violet">GPS login & logout points stored</div></div>
</div>`;}
function passFilter(sh){const f=state.filters,d=driverById(sh.driverId);
  if(f.driver!=="all"&&sh.driverId!==f.driver)return false;
  if(f.platform!=="all"&&sh.platform!==f.platform)return false;
  if(f.status!=="all"&&sh.status!==f.status)return false;
  if(f.search){const q=f.search.toLowerCase();if(!`${d?.name} ${d?.plate} ${sh.loginPlace} ${sh.logoutPlace||""}`.toLowerCase().includes(q))return false;}return true;}
function adminSection(){return {map:secMap,logs:secLogs,km:secKm,fuel:secFuel,drivers:secDrivers}[state.adminTab]();}
function paintAdmin(){const el=$("#adminSection");if(!el)return;el.innerHTML=adminSection();state.adminTab==="map"?mountMap():teardownMap();}

function livePanelInner(){
  const live=onDutyShifts().filter(passFilter);
  const rows=live.map(s=>{const d=driverById(s.driverId);const lat=s.liveLat??s.loginLat,lng=s.liveLng??s.loginLng;
    return `<div class="live-driver-bar"><div class="av">${initials(d?.name)}</div>
      <div class="m"><div class="nm">${d?.name||"Driver"} <span class="tag-plate">${d?.plate||""}</span> <span class="live-chip">LIVE</span></div>
        <div class="sub">${lat!=null?Math.abs(lat).toFixed(4)+"°, "+Math.abs(lng).toFixed(4)+"°":"—"} · <b style="color:var(--amber)">${s.platform}</b> · <span class="spd">${s.speed?s.speed+" km/h":"awaiting GPS…"}</span> · ping ${s.lastPing||s.loginTime||"—"}</div></div>
      <button class="locate-btn" data-map="${lat},${lng}">${ic('pin','i-xs')} Locate</button></div>`;}).join("");
  return `<div class="sec-head"><div><h3>${ic('sat','i-xs')} Live Driver Tracking</h3><p>Real-time GPS of every driver on duty. Updates automatically.</p></div>
    <span class="badge-count ${live.length?"green":""}">${live.length} on duty</span></div>
    ${live.length?rows:`<div class="live-empty">No drivers on duty right now. When a driver clocks in, their live location streams here and moves on the map below.</div>`}`;
}
function secMap(){return `<div class="admin-card"><div id="livePanel">${livePanelInner()}</div></div>
  <div class="admin-card" style="margin-top:13px"><div class="sec-head"><div><h3>${ic('pin','i-xs')} Driver Login & Logout Location Map</h3>
    <p>Green = duty start · Red = logout · Blue pulse = live driver position.</p></div>
    <span class="badge-count">${state.shifts.filter(passFilter).length} shift locations</span></div>
    <div class="mapholder"><div class="map-legend"><span class="lg"><span class="lgd" style="background:var(--green)"></span>Login</span><span class="sep"></span>
      <span class="lg"><span class="lgd" style="background:var(--red)"></span>Logout</span><span class="sep"></span>
      <span class="lg"><span class="lgd" style="background:var(--blue)"></span>Live</span></div><div id="leafmap"></div></div></div>`;}
let liveMarkers={},LMAP=null;
function pinIcon(kind){const inner=kind==="live"?`<span class="ring"></span><span>●</span>`:`<span>${kind==="in"?"↓":"↑"}</span>`;
  return L.divIcon({className:"",html:`<div class="mpin ${kind}">${inner}</div>`,iconSize:[32,32],iconAnchor:[16,kind==="live"?16:30]});}
function teardownMap(){if(LMAP){try{LMAP.remove();}catch(e){}LMAP=null;liveMarkers={};}}
function mountMap(){
  const el=$("#leafmap");if(!el)return;
  if(typeof L==="undefined"){el.innerHTML=`<div style="height:100%;display:grid;place-items:center;background:var(--tile-bg);color:var(--txt-muted);font-size:13px;text-align:center;padding:20px;font-family:var(--mono)">Map is loading… check internet.</div>`;return;}
  teardownMap();
  LMAP=L.map(el,{scrollWheelZoom:true}).setView([29.32,47.98],11);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"}).addTo(LMAP);
  const bounds=[];
  state.shifts.filter(passFilter).forEach(s=>{
    if(s.loginLat!=null){L.marker([s.loginLat,s.loginLng],{icon:pinIcon("in")}).addTo(LMAP).bindPopup(`<b>Login</b><br>${s.loginPlace||""}`);bounds.push([s.loginLat,s.loginLng]);}
    if(s.logoutLat!=null){L.marker([s.logoutLat,s.logoutLng],{icon:pinIcon("out")}).addTo(LMAP).bindPopup(`<b>Logout</b><br>${s.logoutPlace||""}`);bounds.push([s.logoutLat,s.logoutLng]);
      if(s.loginLat!=null)L.polyline([[s.loginLat,s.loginLng],[s.logoutLat,s.logoutLng]],{color:"#3b82f6",weight:2,dashArray:"6 7",opacity:.7}).addTo(LMAP);}
  });
  onDutyShifts().filter(passFilter).forEach(s=>{const d=driverById(s.driverId);const lat=s.liveLat??s.loginLat,lng=s.liveLng??s.loginLng;if(lat==null)return;
    const m=L.marker([lat,lng],{icon:pinIcon("live"),zIndexOffset:1000}).addTo(LMAP).bindPopup(`<b>${d?.name||"Driver"}</b><br>Live · ${s.speed||0} km/h`);liveMarkers[s.id]=m;bounds.push([lat,lng]);});
  if(bounds.length)LMAP.fitBounds(bounds,{padding:[50,50],maxZoom:14});
  setTimeout(()=>{if(LMAP)LMAP.invalidateSize();},60);
}
function refreshLiveMarkers(){
  const lp=$("#livePanel");if(lp)lp.innerHTML=livePanelInner();
  if(!LMAP)return;
  onDutyShifts().forEach(s=>{const m=liveMarkers[s.id];if(m&&s.liveLat!=null)m.setLatLng([s.liveLat,s.liveLng]);});
  if(onDutyShifts().some(s=>s.liveLat!=null&&!liveMarkers[s.id]))mountMap();
}

function secLogs(){
  const shifts=state.shifts.filter(passFilter).sort((a,b)=>b.startedAt-a.startedAt);
  const body=shifts.length?shifts.map(s=>{const d=driverById(s.driverId);
    return `<div class="adm-rec"><div class="top"><b>${s.platform} Shift — ${d?.name||"Driver"} <span class="tag-plate">${d?.plate||""}</span></b><span class="st-badge ${s.status==="ACTIVE"?"st-active":"st-done"}">${s.status}</span></div>
      <div class="lines">
        <div class="row">${ic('calendar','i-xs')} ${fmtDate(s.date)} · Duration <b>${s.duration||"0h 0m"}</b></div>
        <div class="row">${ic('login','i-xs')} Origin: <b>${s.loginPlace||"—"}</b> (${s.loginTime||"—"})</div>
        <div class="row">${ic('nav','i-xs')} Live/End: <b>${s.status==="ACTIVE"?"on road":(s.logoutPlace||"—")}</b></div>
        <div class="row amber">${ic('chart','i-xs')} Distance: <b>${s.distance!=null?"+"+s.distance+" KM":"in progress"}</b> · Trips ${s.trips!=null?s.trips:"—"}</div>
      </div></div>`;}).join(""):emptyBox("No shift logs match your filters.");
  return `<div class="admin-card"><div class="sec-head"><h3>${ic('compass','i-xs')} Driver Shift Duty & Location Logs</h3><span class="badge-count">${shifts.length} shifts</span></div>${body}</div>`;
}
function secKm(){
  const recs=state.kmRecords.filter(r=>passFilter({driverId:r.driverId,platform:r.platform,status:"COMPLETED",loginPlace:"",logoutPlace:""})).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const rows=recs.map(r=>{const d=driverById(r.driverId);return `<tr><td>${fmtDate(r.date)}</td><td><b>${d?d.name:"—"}</b></td><td><span class="tag-plate">${r.plate}</span></td><td style="color:var(--amber)"><b style="color:var(--amber)">${r.platform}</b></td><td><b>${km(r.startOdo)}</b></td><td><b>${r.endOdo!=null?km(r.endOdo):"—"}</b></td><td class="td-dist">+${r.distance} KM</td><td><b>${r.trips!=null?r.trips:"—"}</b></td></tr>`;}).join("");
  return `<div class="admin-card"><div class="sec-head"><div><h3>${ic('chart','i-xs')} Daily Vehicle KM & Odometer Postings</h3><p>Mileage logs submitted by drivers per platform.</p></div><button class="btn btn-ghost" data-act="exportKm">${ic('download','i-xs')} Export KM</button></div>
    ${recs.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Driver</th><th>Plate</th><th>Platform</th><th>Start KM</th><th>End KM</th><th>Distance</th><th>Trips</th></tr></thead><tbody>${rows}</tbody></table></div>`:emptyBox("No KM postings yet.")}</div>`;
}
function secFuel(){
  const recs=state.fuelRecords.filter(r=>{const f=state.filters,d=driverById(r.driverId);if(f.driver!=="all"&&r.driverId!==f.driver)return false;if(f.search&&!`${d?.name} ${r.plate} ${r.station} ${r.place}`.toLowerCase().includes(f.search.toLowerCase()))return false;return true;}).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const cards=recs.map(r=>{const d=driverById(r.driverId);return `<div class="adm-rec"><div class="top"><b>${r.station}</b><span style="font-family:var(--mono);font-size:15px;font-weight:900;color:var(--amber)">${money(r.cost)} KWD</span></div>
    <div class="lines">
      <div class="row">${ic('pin','i-xs')} ${r.place} · ${fmtDate(r.date)} ${r.time||""}</div>
      <div class="row">${ic('fuel','i-xs')} ${r.liters} L of ${r.fuelType} @ ${r.price} KWD/L · Odo ${km(r.odo)} KM</div>
      <div class="row">${ic('user','i-xs')} ${d?d.name:"—"} <span class="tag-plate">${r.plate}</span> · ${(r.payment||"").split(" (")[0]}${r.receipt?" · Ref "+r.receipt:""}</div>
    </div></div>`;}).join("");
  return `<div class="admin-card"><div class="sec-head"><div><h3>${ic('fuel','i-xs')} Daily Fuel Refill Audits & Station Records</h3><p>Petrol station pump logs, liters and cost.</p></div><span class="badge-count green">Total: ${money(totalFuelKwd())} KWD</span></div>${recs.length?cards:emptyBox("No fuel records yet.")}</div>`;
}
function secDrivers(){
  const list=state.drivers.filter(d=>{const f=state.filters;if(f.search&&!`${d.name} ${d.plate} ${d.model}`.toLowerCase().includes(f.search.toLowerCase()))return false;if(f.driver!=="all"&&d.id!==f.driver)return false;return true;});
  const cards=list.map(d=>{const on=!!activeShift(d.id);return `<div class="driver-card">
      <div style="flex:1;min-width:0"><div class="nm">${d.name} <span class="st-badge ${on?"st-active":"st-done"}">${on?"ON DUTY":"OFF DUTY"}</span></div>
        <div class="meta">${ic('phone','i-xs')} ${d.phone||"—"} · ${ic('car','i-xs')} ${d.model} <span class="tag-plate">${d.plate}</span></div>
        <div class="pin">PIN: <b>${d.pin}</b> · Platforms: <b>${(d.platforms||[]).join(", ")}</b> · Lifetime ${km(driverLifetimeKm(d.id))} KM</div></div>
      <div class="acts"><button class="btn btn-ghost" data-addkm="${d.id}">${ic('chart','i-xs')} KM</button><button class="btn btn-ghost" data-addfuel="${d.id}">${ic('fuel','i-xs')} Fuel</button><button class="btn btn-red" data-deldriver="${d.id}">${ic('trash','i-xs')}</button></div>
    </div>`;}).join("");
  return `<div class="admin-card"><div class="sec-head"><div><h3>${ic('users','i-xs')} Sumou Driver Fleet Directory</h3><p>Manage all fleet drivers and assigned vehicles.</p></div><button class="btn btn-blue" data-act="openAddDriver">${ic('plus','i-xs')} Add Driver</button></div>${list.length?cards:emptyBox("No drivers yet. Add your first driver.")}</div>`;
}

    <div class="calc"><div><div class="c-l">Total Daily Distance</div><div class="c-s">Calculated for this date</div></div><div class="c-v" id="kmDist">145 KM</div></div>

  <div class="m-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-amber" data-act="saveKm" data-driver="${id}">${ic('check','i-xs')} Post KM</button></div>`);
  const u=()=>{$("#kmDist").textContent=((+$("#kmEnd").value||0)-(+$("#kmStart").value||0))+" KM";};$("#kmStart").oninput=u;$("#kmEnd").oninput=u;}
function modalFuel(id){const d=driverById(id);state.gps.fuel=null;openModal(`<div class="m-head"><div class="m-ic">${ic('fuel','i-xs')}</div><div><h3>Post Daily Fuel Refill Record</h3><p>${d.name} · ${d.plate}</p></div><button class="x" data-close>${ic('x','i-xs')}</button></div>
  <div class="m-body"><label class="fld">Fuel Station / Brand</label><select id="fStation">${STATIONS.map(s=>`<option>${s}</option>`).join("")}</select><label class="fld">Payment Method</label><select id="fPay">${PAYMENTS.map(p=>`<option>${p}</option>`).join("")}</select>
    <label class="fld">Fuel Type</label><select id="fType">${FUEL_TYPES.map(t=>`<option value="${t.price}">${t.label} (${t.price} KWD)</option>`).join("")}</select>
    <div class="grid2"><div><label class="fld">Liters (L)</label><input id="fLiters" type="number" value="35" /></div><div><label class="fld">Total Cost (KWD)</label><input id="fCost" value="2.975" readonly style="color:var(--amber);font-weight:800" /></div></div>
    <label class="fld">Odometer at Refuel (KM)</label><input id="fOdo" type="number" value="${lastOdometer(id)}" />
    <label class="fld">Receipt / Invoice Ref #</label><input id="fReceipt" value="REC-${Math.floor(100000+Math.random()*900000)}" />
    <label class="fld">Gas Station Location</label>${gpsPickerMini("fuel")}<label class="fld">Notes</label><input id="fNote" value="Full tank refilled" /></div>
  <div class="m-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-amber" data-act="saveFuel" data-driver="${id}">${ic('check','i-xs')} Save Fuel Record</button></div>`);
  const u=()=>{$("#fCost").value=((+$("#fLiters").value||0)*(+$("#fType").value)).toFixed(3);};$("#fLiters").oninput=u;$("#fType").onchange=u;u();}
function modalEndDuty(id){const d=driverById(id);const sh=activeShift(id);state.gps.logout=null;openModal(`<div class="m-head"><div class="m-ic red">${ic('logout','i-xs')}</div><div><h3>Duty Log Out & KM Confirmation</h3><p>${d.name}</p></div><button class="x" data-close>${ic('x','i-xs')}</button></div>
  <div class="m-body"><label class="fld">Ending Odometer (KM)</label><input id="edOdo" type="number" value="${sh.startOdo+85}" /><div class="fhint">Start: ${km(sh.startOdo)} KM</div>
    <div class="calc"><div><div class="c-l">Total Distance Driven</div><div class="c-s">Computed for this shift</div></div><div class="c-v" id="edDist">+85 KM</div></div>
    <label class="fld">Orders / Trips Completed</label><input id="edTrips" type="number" value="12" /><label class="fld">Log Out Location (Verified End Place)</label>${gpsPickerMini("logout")}<label class="fld">Shift Summary Notes</label><input id="edNote" placeholder="e.g. Smooth shift, no incidents" /></div>
  <div class="m-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-red" data-act="confirmEndDuty" data-driver="${id}">${ic('logout','i-xs')} Confirm & Log Out</button></div>`);
  const u=()=>{$("#edDist").textContent="+"+((+$("#edOdo").value||0)-sh.startOdo)+" KM";};$("#edOdo").oninput=u;}

/* ============================================================ ACTIONS (async → Supabase) ============================================================ */
async function doAddDriver(){const name=$("#ndName").value.trim();if(!name)return toast("Driver name is required.");
  if(digitsOnly($("#ndPhone").value).length<6)return toast("A valid phone number is required (login ID).");
  const plats=[...document.querySelectorAll(".ndPlat:checked")].map(c=>c.value);
  const {data,error}=await sb.from("drivers").insert({name,phone:$("#ndPhone").value.trim(),pin:($("#ndPin").value||"1234").slice(0,4),plate:($("#ndPlate").value.trim()||"00000").toUpperCase(),model:$("#ndModel").value.trim()||"Vehicle",platforms:plats.length?plats:["Talabat"]}).select().single();
  if(error){toast("Error: "+error.message);return;}
  const i=state.drivers.findIndex(x=>x.id===data.id);const md=mapDriver(data);if(i>=0)state.drivers[i]=md;else state.drivers.push(md);
  closeModal();toast("Driver registered ✓");render();}
async function doStartDuty(){const d=driverById(state.driverId);if(!state.gps.login)return toast("Tap the GPS Radar gauge to lock your location first.");const g=state.gps.login;
  const plats=(d.platforms&&d.platforms.length?d.platforms:PLATFORMS);
  const plat=state.selectedPlatform||plats[0];
  const startOdo=state.startOdo!=null?state.startOdo:lastOdometer(d.id);
  const {data,error}=await sb.from("shifts").insert({driver_id:d.id,platform:plat,date:today(),status:"ACTIVE",start_odo:startOdo,login_time:g.time,login_place:g.place,login_addr:g.addr,login_lat:g.lat,login_lng:g.lng,live_lat:g.lat,live_lng:g.lng,live_time:g.time,started_at:new Date().toISOString()}).select().single();
  if(error){toast("Error: "+error.message);return;}
  const ms=mapShift(data);const i=state.shifts.findIndex(x=>x.id===ms.id);if(i>=0)state.shifts[i]=ms;else state.shifts.push(ms);
  state.gps.login=null;state.startOdo=null;toast("Duty started — you are ON DUTY ✓ Live location sharing.");render();}
async function doSaveStartOdo(){const v=+$("#soOdo").value;if(!v||v<=0)return toast("Enter a valid odometer.");state.startOdo=v;const el=$("#odoVal");if(el)el.textContent=km(v);closeModal();toast("Starting odometer set: "+km(v)+" KM");}
async function doSaveKm(id){const s=+$("#kmStart").value||0,e=+$("#kmEnd").value||0,d=driverById(id);
  const {data,error}=await sb.from("km_records").insert({driver_id:id,plate:d.plate,platform:$("#kmPlatform").value,date:$("#kmDate").value,start_odo:s,end_odo:e,distance:e-s,trips:+$("#kmTrips").value||0,note:$("#kmNote").value}).select().single();
  if(error){toast("Error: "+error.message);return;}
  const mk=mapKm(data);if(!state.kmRecords.find(x=>x.id===mk.id))state.kmRecords.push(mk);closeModal();toast("Daily KM posted ✓");render();}
async function doSaveFuel(id){if(!state.gps.fuel)return toast("Set the gas station location (GPS Detect or Hub).");const g=state.gps.fuel,d=driverById(id);const price=+$("#fType").value,liters=+$("#fLiters").value||0;
  const {data,error}=await sb.from("fuel_records").insert({driver_id:id,plate:d.plate,station:$("#fStation").value,payment:$("#fPay").value,fuel_type:$("#fType").selectedOptions[0].textContent.split(" (")[0],price,liters,cost:liters*price,odo:+$("#fOdo").value||0,receipt:$("#fReceipt").value,place:g.place,lat:g.lat,lng:g.lng,note:$("#fNote").value,date:today(),time:nowTime()}).select().single();
  if(error){toast("Error: "+error.message);return;}
  const mf=mapFuel(data);if(!state.fuelRecords.find(x=>x.id===mf.id))state.fuelRecords.push(mf);state.gps.fuel=null;closeModal();toast("Fuel record saved ✓");render();}
async function doEndDuty(id){const sh=activeShift(id);if(!state.gps.logout)return toast("Set your logout location (GPS Detect or Hub).");const g=state.gps.logout;const end=+$("#edOdo").value||sh.startOdo;const mins=Math.max(1,Math.round((Date.now()-sh.startedAt)/60000));
  const upd={status:"COMPLETED",end_odo:end,distance:end-sh.startOdo,trips:+$("#edTrips").value||0,logout_time:g.time,logout_place:g.place,logout_addr:g.addr,logout_lat:g.lat,logout_lng:g.lng,duration:`${Math.floor(mins/60)}h ${mins%60}m`,summary:$("#edNote").value};
  const {error}=await sb.from("shifts").update(upd).eq("id",sh.id);
  if(error){toast("Error: "+error.message);return;}
  await sb.from("km_records").insert({driver_id:id,plate:driverById(id).plate,platform:sh.platform,date:sh.date,start_odo:sh.startOdo,end_odo:end,distance:end-sh.startOdo,trips:upd.trips,note:upd.summary});
  stopLiveWatch();state.gps.logout=null;closeModal();toast("Duty completed — logged out ✓");await loadAll();render();}
async function doDeleteDriver(id){if(!confirm("Remove this driver and ALL their records?"))return;const {error}=await sb.from("drivers").delete().eq("id",id);if(error){toast("Error: "+error.message);return;}await loadAll();toast("Driver removed");render();}
async function doClearData(){if(!confirm("Clear ALL drivers, shifts, KM and fuel records? This cannot be undone."))return;
  await sb.from("fuel_records").delete().not("id","is",null);await sb.from("km_records").delete().not("id","is",null);await sb.from("shifts").delete().not("id","is",null);await sb.from("drivers").delete().not("id","is",null);
  await loadAll();toast("All data cleared");render();}
function exportCsv(rows,fn){const csv=rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=fn;a.click();toast("Exported "+fn);}
function doExportAll(){const rows=[["Type","Driver","Plate","Platform","Date","Detail1","Detail2","Detail3"]];state.shifts.forEach(s=>{const d=driverById(s.driverId);rows.push(["Shift",d?.name,d?.plate,s.platform,s.date,`In:${s.loginPlace}`,`Out:${s.logoutPlace||"pending"}`,`Dist:${s.distance??"-"}`]);});state.fuelRecords.forEach(f=>{const d=driverById(f.driverId);rows.push(["Fuel",d?.name,f.plate,"-",f.date,`${f.liters}L ${f.fuelType}`,`${money(f.cost)} KWD`,f.station]);});exportCsv(rows,"sumou-fleet-export.csv");}
function doExportKm(){const rows=[["Date","Driver","Plate","Platform","Start KM","End KM","Distance","Trips"]];state.kmRecords.forEach(r=>{const d=driverById(r.driverId);rows.push([r.date,d?.name,r.plate,r.platform,r.startOdo,r.endOdo??"-",r.distance??"-",r.trips??"-"]);});exportCsv(rows,"sumou-km-report.csv");}

/* ============================================================ EVENTS ============================================================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab],[data-plat],[data-addkm],[data-addfuel],[data-deldriver],[data-drtab],[data-gpsdetect],[data-hubstoggle],[data-hubpick],[data-map],[data-close]");
  if(!t)return;
  if(t.hasAttribute("data-close")){closeModal();return;}
  if(t.dataset.plat){state.selectedPlatform=t.dataset.plat;document.querySelectorAll(".platform-btns .btn-p").forEach(b=>b.classList.toggle("active",b.dataset.plat===t.dataset.plat));return;}
  if(t.dataset.tab){state.adminTab=t.dataset.tab;document.querySelectorAll(".admin-tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t.dataset.tab));paintAdmin();return;}
  if(t.dataset.drtab){const sh=t.dataset.drtab;$("#drShifts").style.display=sh==="shifts"?"flex":"none";const df=$("#drFuel");df.classList.toggle("hidden",sh!=="fuel");df.style.display=sh==="fuel"?"flex":"none";t.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b===t));return;}
  if(t.dataset.addkm){modalPostKm(t.dataset.addkm);return;}
  if(t.dataset.addfuel){modalFuel(t.dataset.addfuel);return;}
  if(t.dataset.deldriver){doDeleteDriver(t.dataset.deldriver);return;}
  if(t.dataset.map){const[la,ln]=t.dataset.map.split(",");if(la&&la!=="null")window.open(`https://www.openstreetmap.org/?mlat=${la}&mlon=${ln}#map=15/${la}/${ln}`,"_blank");return;}
  if(t.dataset.gpsdetect){detectGps(t.dataset.gpsdetect);return;}
  if(t.dataset.hubstoggle){const m=$("#hubs-"+t.dataset.hubstoggle);if(m)m.classList.toggle("hidden");return;}
  if(t.dataset.hubpick){const[k,i]=t.dataset.hubpick.split(":");setHubGps(k,+i);return;}
  const a=t.dataset.act;if(!a)return;
  switch(a){
    case "adminLogin":{const err=$("#adminErr");if($("#adminPass").value===ADMIN_PASSCODE){state.screen="admin";saveSession({role:"admin"});render();}else{if(err){err.textContent="Incorrect admin passcode (default: 9999).";err.classList.remove("hidden");}}break;}
    case "driverLogin":{const err=$("#loginErr");const e2=digitsOnly($("#dlPhone").value),pin=$("#dlPin").value;
      const fail=m=>{if(err){err.textContent=m;err.classList.remove("hidden");}else toast(m);};
      if(e2.length<4){fail("Enter your phone number.");break;}
      const d=state.drivers.find(x=>{const p=digitsOnly(x.phone);return p&&(p===e2||p.slice(-8)===e2.slice(-8)||p.endsWith(e2)||e2.endsWith(p));});
      if(!d){fail("No account found for this phone number.");break;}
      if(d.pin!==pin){fail("Incorrect PIN.");break;}
      state.driverId=d.id;state.screen="driver";state.selectedPlatform=(d.platforms&&d.platforms[0])||null;state.startOdo=null;saveSession({role:"driver",driverId:d.id});render();break;}
    case "logout":stopLiveWatch();clearSession();state.screen="landing";state.driverId=null;state.gps={};state.selectedPlatform=null;state.startOdo=null;render();break;
    case "editOdo":modalStartOdo();break;
    case "saveStartOdo":doSaveStartOdo();break;
    case "gpsGauge":{const sh=activeShift(state.driverId);if(sh)manualLive(sh.id);else detectGps("login");break;}
    case "openAddDriver":modalAddDriver();break;
    case "saveDriver":doAddDriver();break;
    case "startDuty":doStartDuty();break;
    case "openKm":modalPostKm(state.driverId);break;
    case "openFuel":modalFuel(state.driverId);break;
    case "openEndDuty":modalEndDuty(state.driverId);break;
    case "saveKm":doSaveKm(t.dataset.driver);break;
    case "saveFuel":doSaveFuel(t.dataset.driver);break;
    case "confirmEndDuty":doEndDuty(t.dataset.driver);break;
    case "exportCsv":doExportAll();break;
    case "exportKm":doExportKm();break;
    case "clearData":doClearData();break;
  }
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="dlPin"||e.target.id==="dlPhone"){const b=$('[data-act="driverLogin"]');if(b)b.click();}if(e.target.id==="adminPass"){const b=$('[data-act="adminLogin"]');if(b)b.click();}});
document.addEventListener("input",e=>{if(e.target.id==="fSearch"){state.filters.search=e.target.value;paintAdmin();}});
document.addEventListener("change",e=>{
  if(e.target.id==="fDriver"){state.filters.driver=e.target.value;paintAdmin();}
  if(e.target.id==="fPlatform"){state.filters.platform=e.target.value;paintAdmin();}
  if(e.target.id==="fStatus"){state.filters.status=e.target.value;paintAdmin();}});

/* ============================================================ BOOT ============================================================ */
(async function boot(){
  try{
    await loadAll();
    state.ready=true;
    subscribeRealtime();
    const sess=loadSession();
    if(sess&&sess.role==="admin"){state.screen="admin";}
    else if(sess&&sess.role==="driver"&&driverById(sess.driverId)){state.screen="driver";state.driverId=sess.driverId;state.selectedPlatform=(driverById(sess.driverId).platforms||[])[0]||null;}
    render();
  }catch(err){
    console.error(err);
    app.innerHTML=`<div class="authgate"><div class="authcard"><div class="authbrand"><div class="logo-box">${ic('truck','i-lg')}</div><div class="ab-text"><b>SUMOU FLEET</b><small>Connection error</small></div></div>
      <div class="autherr" style="display:block">Could not connect to the database. Make sure the Supabase SQL setup was run and the URL/key are correct.<br><br><b>Error:</b> ${(err&&err.message)||err}</div>
      <button class="btn btn-amber btn-block" style="height:44px" onclick="location.reload()">Retry</button></div></div>`;
  }
})();
</script>
</body>
</html>
