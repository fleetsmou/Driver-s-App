<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sumou Fleet - Driver Duty & Fuel Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#e9edf3; --panel:#ffffff;
    --ink:#1b2433; --ink2:#556072; --muted:#8794a6; --muted2:#a3adbd;
    --line:#e5eaf1; --line2:#dbe2ec; --soft:#f5f8fb; --soft2:#eef2f7;
    --green:#10b981; --green-d:#0e9d6e; --green-tint:#e6f7f0; --green-ink:#0c7a56;
    --red:#ef4444; --red-tint:#fdecec; --red-ink:#d13a3a;
    --amber:#f59e0b; --amber-tint:#fbf1de; --amber-ink:#b9760a;
    --blue:#3b82f6; --blue-tint:#e8f0fe;
    --violet:#8b5cf6; --violet-tint:#eee9fd; --violet-ink:#6d40d8;
    --header:#0f1b28; --header2:#132534;
    --mono:'Roboto Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --shadow:0 1px 2px rgba(16,30,54,.05),0 1px 3px rgba(16,30,54,.04);
    --shadow2:0 6px 24px rgba(16,30,54,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;}
  .hidden{display:none !important;}
  a{color:inherit;}
  .appbar{background:var(--header);color:#fff;border-bottom:1px solid #0a1420;position:sticky;top:0;z-index:30;}
  .appbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:15px 24px;}
  .brand{display:flex;align-items:center;gap:13px;}
  .brand .logo{width:50px;height:50px;border-radius:13px;background:linear-gradient(135deg,#13c78a,#0c8f63);display:grid;place-items:center;font-size:25px;box-shadow:0 6px 16px rgba(16,185,129,.28);}
  .brand .b-title{display:flex;align-items:center;gap:9px;}
  .brand h1{font-size:20px;font-weight:800;letter-spacing:.4px;}
  .brand .b-sub{font-size:12px;color:#8fa0b3;margin-top:3px;}
  .app-badge{font-size:10.5px;font-weight:800;letter-spacing:.7px;padding:3px 9px;border-radius:7px;text-transform:uppercase;}
  .app-badge.driver{color:#3fd9a3;border:1px solid rgba(63,217,163,.45);background:rgba(16,185,129,.12);}
  .app-badge.admin{color:#f7b53f;border:1px solid rgba(247,181,63,.45);background:rgba(245,158,11,.12);}
  .appbar-spacer{flex:1;}
  .hstats{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:9px 16px;font-size:13px;color:#c3cfdc;}
  .hstats b{color:#fff;font-weight:700;}
  .hstats .gdot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(16,185,129,.2);}
  .hstats .sep{width:1px;height:16px;background:rgba(255,255,255,.14);}
  .who{display:flex;align-items:center;gap:8px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);border-radius:22px;padding:7px 14px;font-size:13px;font-weight:700;}
  .who .gdot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.2);}
  .who .plate{color:#3fd9a3;font-family:var(--mono);font-weight:600;font-size:12px;}
  .btn-logout{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#e7edf4;padding:9px 15px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;}
  .btn-logout:hover{background:rgba(255,255,255,.12);}
  .wrap{max-width:1280px;margin:0 auto;padding:22px 24px 60px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}
  .pad{padding:20px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;border:0;border-radius:10px;padding:11px 16px;font-size:13.5px;font-weight:700;white-space:nowrap;}
  .btn-primary{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.25);}
  .btn-primary:hover{background:var(--green-d);}
  .btn-dark{background:var(--header);color:#fff;} .btn-dark:hover{background:var(--header2);}
  .btn-outline{background:#fff;border:1px solid var(--line2);color:var(--ink2);} .btn-outline:hover{background:var(--soft);}
  .btn-red-o{background:#fff;border:1px solid #f3c6c6;color:var(--red-ink);} .btn-red-o:hover{background:var(--red-tint);}
  .btn-green-o{background:#fff;border:1px solid #b6e6d3;color:var(--green-ink);} .btn-green-o:hover{background:var(--green-tint);}
  .btn-lg{width:100%;padding:15px;font-size:15px;border-radius:12px;}
  label.fld{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:600;margin:0 0 7px;}
  label.fld .i{color:var(--muted);}
  input,select,textarea{width:100%;background:#fff;border:1px solid var(--line2);color:var(--ink);border-radius:10px;padding:12px 13px;font-size:14px;font-family:inherit;outline:none;transition:.15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.13);}
  input::placeholder{color:var(--muted2);}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer;}
  .fhint{font-size:11.5px;color:var(--muted);margin-top:6px;}
  .num-wrap{position:relative;} .num-wrap .suffix{position:absolute;right:14px;top:12px;font-size:13px;color:var(--muted);font-weight:700;font-family:var(--mono);}
  .tag-plate{font-family:var(--mono);font-size:11.5px;font-weight:600;background:var(--soft2);color:var(--ink2);border:1px solid var(--line2);padding:3px 8px;border-radius:6px;letter-spacing:.5px;}
  .st-badge{font-size:11px;font-weight:800;letter-spacing:.5px;padding:4px 10px;border-radius:20px;text-transform:uppercase;}
  .st-done{background:var(--soft2);color:var(--ink2);} .st-active{background:var(--green-tint);color:var(--green-ink);}
  .chip-plat{font-size:11px;font-weight:600;background:#fff;border:1px solid var(--line2);color:var(--ink2);padding:5px 12px;border-radius:20px;}
  .badge-count{font-size:12px;font-weight:700;background:var(--soft2);color:var(--ink2);border:1px solid var(--line2);padding:6px 12px;border-radius:9px;}
  .land{max-width:460px;margin:6vh auto 0;}
  .land-hero{text-align:center;margin-bottom:22px;}
  .land-hero .logo{width:74px;height:74px;border-radius:19px;margin:0 auto 14px;background:linear-gradient(135deg,#13c78a,#0c8f63);display:grid;place-items:center;font-size:36px;box-shadow:0 12px 30px rgba(16,185,129,.3);}
  .land-hero h1{font-size:29px;font-weight:800;letter-spacing:.5px;} .land-hero p{color:var(--ink2);font-size:14px;margin-top:6px;}
  .seg{display:flex;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:6px;}
  .seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--ink2);border:0;border-radius:9px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  .seg button.active{background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(16,185,129,.25);}
  .seg button.active.admin{background:var(--header);}
  .note{background:var(--green-tint);border:1px solid #cdeede;border-radius:11px;padding:13px;font-size:12.5px;color:var(--green-ink);margin:16px 0;}
  .note.admin{background:var(--amber-tint);border-color:#f2dcb4;color:var(--amber-ink);}
  .empty{text-align:center;padding:26px 12px;}
  .empty .eic{width:60px;height:60px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:26px;margin:0 auto 12px;}
  .empty h3{font-size:17px;} .empty p{color:var(--ink2);font-size:13px;margin:7px auto 16px;max-width:340px;line-height:1.5;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);}
  .kpi-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .kpi-label{font-size:11px;font-weight:700;letter-spacing:.7px;color:var(--muted);text-transform:uppercase;}
  .kpi-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;}
  .ic-green{background:var(--green-tint);} .ic-blue{background:var(--blue-tint);} .ic-amber{background:var(--amber-tint);} .ic-violet{background:var(--violet-tint);}
  .kpi-num{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--ink);margin-top:12px;letter-spacing:-1px;}
  .kpi-num small{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0;}
  .kpi-sub{font-size:12px;margin-top:6px;color:var(--ink2);} .kpi-sub.green{color:var(--green-ink);} .kpi-sub.violet{color:var(--violet-ink);}
  .controls{margin-bottom:16px;}
  .ctl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .tabgroup{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;}
  .tabgroup button{display:flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--ink2);padding:10px 13px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .tabgroup button:hover{background:var(--soft);} .tabgroup button.active{background:var(--header);color:#fff;}
  .tabgroup button .ct{opacity:.6;font-weight:700;} .tabgroup button.active .ct{opacity:.85;}
  .ctl-actions{display:flex;gap:9px;flex-wrap:wrap;}
  .ctl-filters{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .search{position:relative;} .search .si{position:absolute;left:13px;top:12px;color:var(--muted);} .search input{padding-left:37px;}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;}
  .sec-head h3{font-size:16px;display:flex;align-items:center;gap:9px;color:var(--ink);}
  .sec-head p{font-size:12.5px;color:var(--ink2);margin-top:4px;} .sec-ic{color:var(--green);}
  #leafmap{height:520px;border-radius:12px;margin-top:16px;z-index:1;}
  .map-legend{position:absolute;top:12px;left:12px;z-index:500;background:#fff;border:1px solid var(--line2);border-radius:11px;padding:9px 13px;display:flex;gap:14px;align-items:center;font-size:12px;box-shadow:var(--shadow);}
  .map-legend .lg{display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600;} .map-legend .lgd{width:11px;height:11px;border-radius:50%;} .map-legend .sep{width:1px;height:14px;background:var(--line2);}
  .mapholder{position:relative;}
  .mpin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.3);border:2px solid #fff;}
  .mpin span{transform:rotate(-45deg);font-size:15px;color:#fff;font-weight:800;}
  .mpin.in{background:var(--green);} .mpin.out{background:var(--red);}
  .mpin.live{border-radius:50%;background:var(--blue);transform:none;position:relative;} .mpin.live span{transform:none;}
  .mpin.live .ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--blue);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
  .live-head{display:flex;align-items:center;gap:9px;justify-content:space-between;}
  .live-row{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;}
  .live-row .av{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0;}
  .live-row .lr-m{flex:1;min-width:0;} .live-row .lr-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .live-row .lr-sub{font-size:12px;color:var(--ink2);margin-top:3px;font-family:var(--mono);} .live-row .lr-sub .spd{color:var(--amber-ink);font-weight:700;}
  .live-row .lr-r{text-align:right;flex-shrink:0;}
  .livedot{font-size:10.5px;font-weight:800;color:var(--green-ink);letter-spacing:.5px;display:inline-flex;align-items:center;gap:5px;}
  .livedot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);animation:blip 1.3s infinite;}
  @keyframes blip{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 6px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
  .lr-time{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px;}
  .lr-loc{margin-top:6px;background:#fff;border:1px solid var(--line2);color:var(--blue);border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .live-empty{text-align:center;color:var(--ink2);font-size:13px;padding:18px 10px;}
  .rec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;box-shadow:var(--shadow);}
  .rec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .rec-title{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:700;flex-wrap:wrap;}
  .rec-date{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:8px;} .rec-date b{color:var(--ink);}
  .rec-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
  .rsub{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:14px;}
  .rsub-head{font-size:12px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:6px;} .rsub-head.in{color:var(--green-ink);} .rsub-head.out{color:var(--red-ink);}
  .rsub-place{font-size:14px;font-weight:700;margin-top:9px;} .rsub-addr{font-size:12px;color:var(--ink2);margin-top:2px;}
  .rsub-odo{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--ink2);}
  .rsub-odo b{font-family:var(--mono);font-size:13.5px;color:var(--ink);letter-spacing:.5px;}
  .rsub-pending{font-size:12.5px;color:var(--ink2);font-style:italic;margin-top:9px;}
  .rec-foot{display:flex;gap:22px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .rec-foot .dist{color:var(--green-ink);font-weight:800;font-size:13.5px;} .rec-foot .trips{color:var(--ink2);font-size:13px;} .rec-foot .rnote{color:var(--muted);font-size:12px;font-style:italic;margin-left:auto;}
  .pilltabs{display:inline-flex;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:6px;}
  .pilltabs button{display:flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--ink2);padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .pilltabs button.active{background:var(--header);color:#fff;}
  .dcard{overflow:hidden;}
  .dband{background:linear-gradient(120deg,#0f1b28,#16293b);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:15px;}
  .robot{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,#1f5066,#123a4d);display:grid;place-items:center;font-size:26px;position:relative;flex-shrink:0;}
  .robot .rd{position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;border:2px solid #16293b;} .rd.on{background:var(--green);} .rd.off{background:#64748b;}
  .dband-main{flex:1;min-width:0;} .dband-name{font-size:19px;font-weight:800;display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
  .pill-status{font-size:11px;font-weight:800;letter-spacing:.5px;padding:5px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;}
  .pill-status.off{background:rgba(255,255,255,.08);color:#c3cfdc;} .pill-status.on{background:rgba(16,185,129,.18);color:#4fe0ac;} .pill-status .d{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .dband-sub{font-size:13px;color:#9db0c3;margin-top:6px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;} .dband-sub .tag-plate{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#dfe8f0;}
  .dchips{display:flex;gap:7px;flex-wrap:wrap;} .dchips .chip-plat{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#dfe8f0;}
  .dbody{padding:22px;} .dbody h3{font-size:17px;display:flex;align-items:center;gap:9px;} .dbody .dhint{color:var(--ink2);font-size:13px;margin:6px 0 18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .gpsbox{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:16px;margin-top:18px;}
  .gps-head{display:flex;align-items:flex-start;gap:12px;}
  .gps-ic{width:38px;height:38px;border-radius:11px;background:var(--green-tint);display:grid;place-items:center;font-size:18px;flex-shrink:0;}
  .gps-head .gh-t{flex:1;} .gps-head .gh-t b{font-size:14px;} .gps-head .gh-t span{display:block;font-size:12px;color:var(--ink2);margin-top:2px;}
  .gps-actions{display:flex;gap:8px;position:relative;}
  .btn-gps{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #b6e6d3;color:var(--green-ink);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-hubs{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line2);color:var(--ink2);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .hubmenu{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow2);width:290px;padding:7px;z-index:20;}
  .hubmenu .hm-t{font-size:10.5px;color:var(--muted);padding:8px 10px 6px;letter-spacing:.5px;font-weight:700;}
  .hubmenu button{width:100%;display:flex;justify-content:space-between;gap:10px;background:transparent;border:0;color:var(--ink);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;text-align:left;font-family:inherit;}
  .hubmenu button:hover{background:var(--soft);} .hubmenu button span{color:var(--muted);font-family:var(--mono);font-size:11px;}
  .gps-card{background:#fff;border:1px solid var(--line2);border-radius:11px;padding:14px;margin-top:14px;}
  .gc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;} .gc-place{font-size:14px;font-weight:700;}
  .badge-lock{font-size:11px;font-weight:700;color:var(--green-ink);background:var(--green-tint);border:1px solid #cdeede;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .gc-addr{font-size:12.5px;color:var(--ink2);margin-top:5px;}
  .gc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);font-family:var(--mono);}
  .dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px;}
  .dstat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);}
  .dstat .ds-l{font-size:12.5px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:7px;} .dstat .ds-l .i{color:var(--muted);}

/* ---------- DB <-> app mappers ---------- */
const mapDriver=r=>({id:r.id,name:r.name,phone:r.phone,pin:r.pin,plate:r.plate,model:r.model,platforms:r.platforms||[]});
const mapShift=r=>({id:r.id,driverId:r.driver_id,platform:r.platform,date:r.date,status:r.status,

  startedAt:r.started_at?new Date(r.started_at).getTime():Date.now()});
const mapKm=r=>({id:r.id,driverId:r.driver_id,plate:r.plate,platform:r.platform,date:r.date,startOdo:r.start_odo,endOdo:r.end_odo,distance:r.distance,trips:r.trips,note:r.note});
const mapFuel=r=>({id:r.id,driverId:r.driver_id,plate:r.plate,station:r.station,payment:r.payment,fuelType:r.fuel_type,price:r.price,liters:r.liters,cost:r.cost,odo:r.odo,receipt:r.receipt,place:r.place,lat:r.lat,lng:r.lng,note:r.note,date:r.date,time:r.time});

/* ---------- derived ---------- */
const driverById=id=>state.drivers.find(d=>d.id===id);
const driverShifts=id=>state.shifts.filter(s=>s.driverId===id);
const activeShift=id=>state.shifts.find(s=>s.driverId===id&&s.status==="ACTIVE");
const driverLifetimeKm=id=>state.kmRecords.filter(r=>r.driverId===id).reduce((a,r)=>a+(r.distance||0),0);
function lastOdometer(id){const s=driverShifts(id).filter(x=>x.endOdo!=null).sort((a,b)=>b.startedAt-a.startedAt)[0];return s?s.endOdo:30000;}
const totalFleetKm=()=>state.kmRecords.reduce((a,r)=>a+(r.distance||0),0);
const totalFuelKwd=()=>state.fuelRecords.reduce((a,f)=>a+(f.cost||0),0);
const totalLiters=()=>state.fuelRecords.reduce((a,f)=>a+(f.liters||0),0);

const onDutyShifts=()=>state.shifts.filter(s=>s.status==="ACTIVE");

/* ============================================================ DATA LAYER ============================================================ */
async function loadAll(){
  const [d,s,k,f]=await Promise.all([
    sb.from("drivers").select("*").order("created_at"),
    sb.from("shifts").select("*").order("created_at"),
    sb.from("km_records").select("*").order("created_at"),
    sb.from("fuel_records").select("*").order("created_at"),
  ]);
  if(d.error||s.error||k.error||f.error){console.error(d.error||s.error||k.error||f.error);throw (d.error||s.error||k.error||f.error);}
  state.drivers=(d.data||[]).map(mapDriver);
  state.shifts=(s.data||[]).map(mapShift);
  state.kmRecords=(k.data||[]).map(mapKm);
  state.fuelRecords=(f.data||[]).map(mapFuel);
}
function subscribeRealtime(){
  sb.channel("sumou-live")
    .on("postgres_changes",{event:"*",schema:"public"},onRealtime)
    .subscribe();
}
function applyChange(table,ev,nw,oldRow){
  const cfg={drivers:["drivers",mapDriver],shifts:["shifts",mapShift],km_records:["kmRecords",mapKm],fuel_records:["fuelRecords",mapFuel]}[table];
  if(!cfg)return;const [arrName,mapper]=cfg;const arr=state[arrName];
  if(ev==="DELETE"){const id=oldRow&&oldRow.id;const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);return;}
  const row=mapper(nw);const i=arr.findIndex(x=>x.id===row.id);if(i>=0)arr[i]=row;else arr.push(row);
}
let renderT=null;
function scheduleRender(){clearTimeout(renderT);renderT=setTimeout(()=>{
  if($("#overlay"))return;const ae=document.activeElement;
  if(ae&&["INPUT","SELECT","TEXTAREA"].includes(ae.tagName))return;render();},450);}
function onRealtime(p){
  applyChange(p.table,p.eventType,p.new,p.old);
  const liveMove=p.table==="shifts"&&p.eventType==="UPDATE"&&p.new&&p.new.status==="ACTIVE"&&p.old&&p.old.status==="ACTIVE";
  if(state.screen==="admin"&&state.adminTab==="map"&&liveMove){refreshLiveMarkers();return;}
  scheduleRender();
}

/* ============================================================ GPS ============================================================ */
async function reverseGeocode(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat=${lat}&lon=${lng}`,{headers:{"Accept":"application/json"}});
    const j=await r.json();const a=j.address||{};
    const place=a.neighbourhood||a.suburb||a.city_district||a.quarter||a.road||a.city||a.town||a.village||j.name||"Current Location";
    const city=a.city||a.town||a.state||"Kuwait";
    return {place,addr:j.display_name?j.display_name.split(",").slice(0,3).join(", "):`${place}, ${city}`};
  }catch(e){return {place:"Current Location",addr:`${(+lat).toFixed(5)}, ${(+lng).toFixed(5)}`};}
}
function detectGps(kind){
  if(!navigator.geolocation){toast("GPS not supported on this device — pick a Hub");return;}
  toast("📡 Getting your GPS location…");
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lng,accuracy}=pos.coords;
    const g=await reverseGeocode(lat,lng);
    state.gps[kind]={place:g.place,addr:g.addr,lat:+lat.toFixed(5),lng:+lng.toFixed(5),acc:Math.max(1,Math.round(accuracy||15)),time:nowTime()};
    refreshGps(kind);toast("✓ GPS locked");
  },err=>{toast(err.code===1?"GPS permission denied — allow location or pick a Hub":"Couldn't get GPS — pick a Hub");},{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}
function setHubGps(kind,i){const h=HUBS[i];state.gps[kind]={place:h.name,addr:h.addr,lat:h.lat,lng:h.lng,acc:15,time:nowTime()};refreshGps(kind);toast("Hub location set ✓");}
function refreshGps(kind){const el=$("#"+kind+"Gps");if(el)el.innerHTML=gpsPickerMini(kind);}

/* live position streaming while on duty */
let watchId=null,lastLiveWrite=0;
function startLiveWatch(shiftId){
  if(!navigator.geolocation)return;stopLiveWatch();
  watchId=navigator.geolocation.watchPosition(async pos=>{
    const now=Date.now();if(now-lastLiveWrite<6000)return;lastLiveWrite=now;
    const {latitude:lat,longitude:lng,speed}=pos.coords;
    const kmh=(speed!=null&&speed>=0)?Math.round(speed*3.6):null;
    try{await sb.from("shifts").update({live_lat:+lat.toFixed(5),live_lng:+lng.toFixed(5),speed:kmh,live_time:nowTime()}).eq("id",shiftId);}catch(e){}
  },err=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function stopLiveWatch(){if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}}

/* ============================================================ ROUTER ============================================================ */

  teardownMap();

  else if(state.screen==="admin")app.innerHTML=viewAdmin();
  else if(state.screen==="driver")app.innerHTML=viewDriver();

}
let timerInt=null;
function postRender(){
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  if(state.screen==="driver"){
    const sh=activeShift(state.driverId);

      startLiveWatch(sh.id);} else stopLiveWatch();
  } else stopLiveWatch();

}

      <select id="fPlatform"><option value="all">All Online Platforms</option>${PLATFORMS.map(p=>`<option ${state.filters.platform===p?"selected":""}>${p}</option>`).join("")}</select>
      <select id="fStatus"><option value="all">All Shift Statuses</option><option ${state.filters.status==="ACTIVE"?"selected":""}>ACTIVE</option><option ${state.filters.status==="COMPLETED"?"selected":""}>COMPLETED</option></select></div></div>
  <div id="adminSection">${adminSection()}</div>${footer()}</div>`;}
function atab(id,label,c){return `<button class="${state.adminTab===id?"active":""}" data-tab="${id}">${label}${c!=null?` <span class="ct">(${c})</span>`:""}</button>`;}
function adminKpis(){return `<div class="kpis">
  <div class="kpi"><div class="kpi-top"><span class="kpi-label">Active On Duty</span><span class="kpi-ic ic-green">〰️</span></div><div class="kpi-num">${activeCount()} <small>/ ${state.drivers.length} drivers</small></div><div class="kpi-sub green">Currently logged in & delivering</div></div>
  <div class="kpi"><div class="kpi-top"><span class="kpi-label">Total Fleet KMs</span><span class="kpi-ic ic-blue">🚗</span></div><div class="kpi-num">${km(totalFleetKm())} <small>KM</small></div><div class="kpi-sub">Across all online platforms</div></div>
  <div class="kpi"><div class="kpi-top"><span class="kpi-label">Fuel Spend</span><span class="kpi-ic ic-amber">⛽</span></div><div class="kpi-num">${money(totalFuelKwd())} <small>KWD</small></div><div class="kpi-sub">${totalLiters().toFixed(1)} Liters total pumped</div></div>
  <div class="kpi"><div class="kpi-top"><span class="kpi-label">Shifts & Locations</span><span class="kpi-ic ic-violet">📍</span></div><div class="kpi-num">${state.shifts.length} <small>Records</small></div><div class="kpi-sub violet">GPS login & logout points stored</div></div></div>`;}
function passFilter(sh){const f=state.filters,d=driverById(sh.driverId);
  if(f.driver!=="all"&&sh.driverId!==f.driver)return false;
  if(f.platform!=="all"&&sh.platform!==f.platform)return false;
  if(f.status!=="all"&&sh.status!==f.status)return false;
  if(f.search){const q=f.search.toLowerCase();if(!`${d?.name} ${d?.plate} ${sh.loginPlace} ${sh.logoutPlace||""}`.toLowerCase().includes(q))return false;}return true;}
function adminSection(){return {map:secMap,logs:secLogs,km:secKm,fuel:secFuel,drivers:secDrivers}[state.adminTab]();}
function paintAdmin(){const el=$("#adminSection");if(!el)return;el.innerHTML=adminSection();state.adminTab==="map"?mountMap():teardownMap();}

function livePanelInner(){
  const live=onDutyShifts().filter(passFilter);
  const rows=live.map(s=>{const d=driverById(s.driverId);const lat=s.liveLat??s.loginLat,lng=s.liveLng??s.loginLng;
    return `<div class="live-row"><div class="av">${initials(d?.name)}</div>
      <div class="lr-m"><div class="lr-name">${d?.name||"Driver"} <span class="tag-plate">${d?.plate||""}</span> <span class="chip-plat">${s.platform}</span></div>
        <div class="lr-sub">📍 ${lat!=null?(+lat).toFixed(5):"—"}, ${lng!=null?(+lng).toFixed(5):"—"} · <span class="spd">${s.speed?s.speed+" km/h":"awaiting GPS…"}</span></div></div>
      <div class="lr-r"><span class="livedot">LIVE</span><div class="lr-time">ping ${s.lastPing||s.loginTime}</div><button class="lr-loc" data-map="${lat},${lng}">Locate ↗</button></div></div>`;}).join("");
  return `<div class="live-head"><div class="sec-head" style="margin:0"><div><h3>🛰️ Live Driver Tracking</h3><p>Real-time GPS position of every driver currently on duty. Updates automatically.</p></div></div>
    <span class="badge-count" style="${live.length?'color:var(--green-ink);border-color:#cdeede;background:var(--green-tint)':''}">${live.length} on duty</span></div>
    ${live.length?rows:`<div class="live-empty">No drivers on duty right now. When a driver logs in and starts duty, their live location streams here and moves on the map below.</div>`}`;
}
function secMap(){return `<div class="card pad" style="margin-top:16px"><div id="livePanel">${livePanelInner()}</div></div>
  <div class="card pad" style="margin-top:16px"><div class="sec-head"><div><h3><span class="sec-ic">📍</span> Driver Login & Logout Location Map</h3>
    <p>Click any green marker for duty start, red for logout, blue pulse = live driver position.</p></div>
    <span class="badge-count">Filtered: ${state.shifts.filter(passFilter).length} shift locations</span></div>
    <div class="mapholder"><div class="map-legend"><span class="lg"><span class="lgd" style="background:var(--green)"></span>Login Spot</span><span class="sep"></span>
      <span class="lg"><span class="lgd" style="background:var(--red)"></span>Logout Spot</span><span class="sep"></span>
      <span class="lg"><span class="lgd" style="background:var(--blue)"></span>Live Driver</span></div><div id="leafmap"></div></div></div>`;}
let liveMarkers={},LMAP=null;
function pinIcon(kind){const inner=kind==="live"?`<span class="ring"></span><span>●</span>`:`<span>${kind==="in"?"⇥":"⇤"}</span>`;
  return L.divIcon({className:"",html:`<div class="mpin ${kind}">${inner}</div>`,iconSize:[34,34],iconAnchor:[17,kind==="live"?17:32]});}
function teardownMap(){if(LMAP){try{LMAP.remove();}catch(e){}LMAP=null;liveMarkers={};}}
function mountMap(){
  const el=$("#leafmap");if(!el)return;
  if(typeof L==="undefined"){el.innerHTML=`<div style="height:100%;display:grid;place-items:center;background:var(--soft);border-radius:12px;color:var(--ink2);font-size:13px;text-align:center;padding:20px">🗺️ Map is loading… check internet (map uses OpenStreetMap).</div>`;return;}
  teardownMap();
  LMAP=L.map(el,{scrollWheelZoom:true}).setView([29.32,47.98],11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(LMAP);
  const bounds=[];
  state.shifts.filter(passFilter).forEach(s=>{
    if(s.loginLat!=null){L.marker([s.loginLat,s.loginLng],{icon:pinIcon("in")}).addTo(LMAP).bindPopup(`<b>Login</b><br>${s.loginPlace||""}`);bounds.push([s.loginLat,s.loginLng]);}
    if(s.logoutLat!=null){L.marker([s.logoutLat,s.logoutLng],{icon:pinIcon("out")}).addTo(LMAP).bindPopup(`<b>Logout</b><br>${s.logoutPlace||""}`);bounds.push([s.logoutLat,s.logoutLng]);
      if(s.loginLat!=null)L.polyline([[s.loginLat,s.loginLng],[s.logoutLat,s.logoutLng]],{color:"#3b82f6",weight:2,dashArray:"6 7",opacity:.7}).addTo(LMAP);}
  });
  onDutyShifts().filter(passFilter).forEach(s=>{const d=driverById(s.driverId);const lat=s.liveLat??s.loginLat,lng=s.liveLng??s.loginLng;if(lat==null)return;
    const m=L.marker([lat,lng],{icon:pinIcon("live"),zIndexOffset:1000}).addTo(LMAP).bindPopup(`<b>${d?.name||"Driver"}</b><br>Live · ${s.speed||0} km/h`);liveMarkers[s.id]=m;bounds.push([lat,lng]);});
  if(bounds.length)LMAP.fitBounds(bounds,{padding:[50,50],maxZoom:14});
  setTimeout(()=>{if(LMAP)LMAP.invalidateSize();},60);
}
function refreshLiveMarkers(){
  const lp=$("#livePanel");if(lp)lp.innerHTML=livePanelInner();
  if(!LMAP)return;
  onDutyShifts().forEach(s=>{const m=liveMarkers[s.id];if(m&&s.liveLat!=null)m.setLatLng([s.liveLat,s.liveLng]);});
  if(onDutyShifts().some(s=>s.liveLat!=null&&!liveMarkers[s.id]))mountMap();
}

function secLogs(){
  const shifts=state.shifts.filter(passFilter).sort((a,b)=>b.startedAt-a.startedAt);
  const body=shifts.length?shifts.map(s=>{const d=driverById(s.driverId);
    return `<div class="rec"><div class="rec-head"><div class="rec-title">${s.platform} Shift <span class="tag-plate">${d?.plate||""}</span> <span class="st-badge ${s.status==="ACTIVE"?"st-active":"st-done"}">${s.status}</span></div>
        <div class="rec-date">📅 ${fmtDate(s.date)} • Duration: <b>${s.duration||"0h 0m"}</b></div></div>
      <div class="rec-cols"><div class="rsub"><div class="rsub-head in">↗ LOGGED IN AT (${s.loginTime||"—"})</div><div class="rsub-place">${s.loginPlace||"—"}</div><div class="rsub-addr">${s.loginAddr||""}</div><div class="rsub-odo"><span>Start Odometer:</span><b>${km(s.startOdo)} KM</b></div></div>
        ${s.status==="ACTIVE"?`<div class="rsub"><div class="rsub-head out">↙ LOGOUT PENDING (ON DUTY)</div><div class="rsub-pending">Currently on road. Logout location will be captured when duty ends.</div></div>`
          :`<div class="rsub"><div class="rsub-head out">↙ LOGGED OUT AT (${s.logoutTime||"—"})</div><div class="rsub-place">${s.logoutPlace||"—"}</div><div class="rsub-addr">${s.logoutAddr||""}</div><div class="rsub-odo"><span>End Odometer:</span><b>${km(s.endOdo)} KM</b></div></div>`}</div>
      <div class="rec-foot"><span class="dist">Distance: ${s.distance!=null?"+"+s.distance+" KM":"in progress"}</span><span class="trips">Deliveries/Trips: ${s.trips!=null?s.trips:"—"}</span>${s.summary?`<span class="rnote">Note: "${s.summary}"</span>`:""}</div></div>`;}).join(""):emptyBox("No shift logs match your filters.");
  return `<div class="card pad" style="margin-top:16px"><div class="sec-head"><h3><span class="sec-ic">🧭</span> Driver Shift Duty & Detailed Location Logs</h3><span class="badge-count">Total: ${shifts.length} shifts</span></div>${body}</div>`;
}
function secKm(){
  const recs=state.kmRecords.filter(r=>passFilter({driverId:r.driverId,platform:r.platform,status:"COMPLETED",loginPlace:"",logoutPlace:""})).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const rows=recs.map(r=>{const d=driverById(r.driverId);return `<tr><td>${fmtDate(r.date)}</td><td style="color:var(--ink);font-weight:600">${d?d.name:"—"}</td><td><span class="tag-plate">${r.plate}</span></td><td><span class="chip-plat">${r.platform}</span></td><td><b>${km(r.startOdo)} KM</b></td><td><b>${r.endOdo!=null?km(r.endOdo)+" KM":"—"}</b></td><td class="td-dist">${r.distance!=null?"+"+r.distance+" KM":"—"}</td><td><b>${r.trips!=null?r.trips:"—"}</b></td></tr>`;}).join("");
  return `<div class="card pad" style="margin-top:16px"><div class="sec-head"><div><h3><span class="sec-ic">📊</span> Daily Vehicle KM & Odometer Postings</h3><p>Track mileage logs submitted by drivers for online platform assignments.</p></div><button class="btn btn-outline" data-act="exportKm">⬇️ Export KM Report</button></div>
    ${recs.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Driver</th><th>Plate</th><th>Platform</th><th>Start KM</th><th>End KM</th><th>Distance</th><th>Trips</th></tr></thead><tbody>${rows}</tbody></table></div>`:emptyBox("No KM postings yet.")}</div>`;
}
function secFuel(){
  const recs=state.fuelRecords.filter(r=>{const f=state.filters,d=driverById(r.driverId);if(f.driver!=="all"&&r.driverId!==f.driver)return false;if(f.search&&!`${d?.name} ${r.plate} ${r.station} ${r.place}`.toLowerCase().includes(f.search.toLowerCase()))return false;return true;}).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const cards=recs.map(r=>{const d=driverById(r.driverId);return `<div class="fuel-card"><div class="fc-top"><div class="fc-ic">⛽</div><div style="flex:1"><div style="font-size:15px;font-weight:700">${r.station}</div><div style="font-size:12.5px;color:var(--ink2);margin-top:2px">📍 ${r.place}</div></div><div style="text-align:right"><div class="fc-cost">${money(r.cost)} KWD</div><div style="font-size:12px;color:var(--ink2)">${r.liters} L of ${r.fuelType} @ ${r.price} KWD/L</div></div></div>
    <div class="fc-grid"><div>Driver<b style="font-family:var(--sans)">${d?d.name:"—"}</b></div><div>Refuel Odometer<b>${km(r.odo)} KM</b></div><div>Payment<b style="font-family:var(--sans)">${(r.payment||"").split(" (")[0]}</b></div><div>Receipt / Ref #<b>${r.receipt||"—"}</b></div><div>Date & Time<b style="font-family:var(--sans)">${fmtDate(r.date)} ${r.time||""}</b></div><div>Plate<b>${r.plate}</b></div></div>${r.note?`<div style="font-size:12px;color:var(--muted);font-style:italic;margin-top:10px">Note: "${r.note}"</div>`:""}</div>`;}).join("");
  return `<div class="card pad" style="margin-top:16px"><div class="sec-head"><div><h3><span class="sec-ic">⛽</span> Daily Fuel Refilling Records & Invoices</h3><p>Review petrol station pump logs, liters refilled, and cost calculations.</p></div><span class="badge-count" style="color:var(--green-ink);border-color:#cdeede;background:var(--green-tint)">Total Spend: ${money(totalFuelKwd())} KWD</span></div>${recs.length?cards:emptyBox("No fuel records yet.")}</div>`;
}
function secDrivers(){
  const list=state.drivers.filter(d=>{const f=state.filters;if(f.search&&!`${d.name} ${d.plate} ${d.model}`.toLowerCase().includes(f.search.toLowerCase()))return false;if(f.driver!=="all"&&d.id!==f.driver)return false;return true;});
  const cards=list.map(d=>{const on=!!activeShift(d.id);return `<div class="ddir"><div class="ddir-h"><div class="robot" style="background:linear-gradient(135deg,#1f5066,#123a4d)">🤖<span class="rd ${on?"on":"off"}"></span></div>
      <div style="flex:1"><div class="rec-title" style="font-size:16px">${d.name} <span class="st-badge ${on?"st-active":"st-done"}">${on?"ON DUTY":"OFF DUTY"}</span></div>
        <div style="font-size:12.5px;color:var(--ink2);margin-top:5px">📞 ${d.phone||"—"} • 🚗 ${d.model} <span class="tag-plate">${d.plate}</span></div>
        <div style="margin-top:8px"><span class="pin-badge">Driver PIN: ${d.pin}</span></div>
        <div class="dchips" style="margin-top:8px">${(d.platforms||[]).map(p=>`<span class="chip-plat" style="background:#fff;border-color:var(--line2);color:var(--ink2)">${p}</span>`).join("")}</div></div></div>
      <div class="ddir-foot"><div class="ddir-acts"><button class="btn btn-outline" data-addkm="${d.id}">＋ KM</button><button class="btn btn-green-o" data-addfuel="${d.id}">＋ Fuel</button><button class="btn btn-outline" data-deldriver="${d.id}">🗑️</button></div>
        <div class="ddir-life">Lifetime Fleet KMs<b>${km(driverLifetimeKm(d.id))} KM</b></div></div></div>`;}).join("");
  return `<div class="card pad" style="margin-top:16px"><div class="sec-head"><div><h3><span class="sec-ic">👥</span> Sumou Driver Fleet Directory</h3><p>Manage all active fleet drivers and their assigned delivery vehicles.</p></div><button class="btn btn-primary" data-act="openAddDriver">＋ Add Driver</button></div>${list.length?cards:emptyBox("No drivers yet. Add your first driver.")}</div>`;
}

function viewDriver(){const d=driverById(state.driverId);if(!d){state.screen="landing";return viewLanding();}const sh=activeShift(d.id);
  return `${appbarDriver(d)}<div class="wrap"><div class="card dcard"><div class="dband"><div class="robot">🤖<span class="rd ${sh?"on":"off"}"></span></div>
      <div class="dband-main"><div class="dband-name">${d.name} <span class="pill-status ${sh?"on":"off"}"><span class="d"></span>${sh?"ON DUTY":"OFF DUTY"}</span></div><div class="dband-sub">🚗 ${d.model} <span class="tag-plate">${d.plate}</span> • ${d.phone||""}</div></div>
      <div class="dchips">${(d.platforms||[]).map(p=>`<span class="chip-plat">${p}</span>`).join("")}</div></div>${sh?dutyActive(d,sh):dutyStart(d)}</div>${driverStats(d)}${driverRecords(d)}${footer()}</div>`;}
function dutyStart(d){return `<div class="dbody"><h3>➜ Duty Log In & Shift Start</h3><p class="dhint">Record your starting odometer and verified GPS check-in location to begin duty for Sumou Fleet.</p>
    <div class="grid2"><div><label class="fld"><span class="i">🧾</span> Online Delivery / Ride Platform:</label><select id="dPlatform">${(d.platforms||PLATFORMS).map(p=>`<option>${p}</option>`).join("")}</select><div class="fhint">Select which online platform duty you will be driving for today.</div></div>
      <div><label class="fld"><span class="i">⏱</span> Starting Vehicle Odometer (KM):</label><div class="num-wrap"><input id="dStartOdo" type="number" value="${lastOdometer(d.id)}" /><span class="suffix">KM</span></div><div class="fhint">Odometer reading on vehicle dashboard before rolling out.</div></div></div>
    <div id="loginGps">${gpsPickerMini("login")}</div>
    <label class="fld" style="margin-top:18px"><span class="i">📝</span> Pre-Shift Notes / Vehicle Condition (Optional):</label><input id="dNote" placeholder="e.g. Tires checked, full mobile battery, morning rush shift" />
    <button class="btn btn-primary btn-lg" style="margin-top:20px" data-act="startDuty">➜ Start Duty (Log In Now)</button></div>`;}
function dutyActive(d,sh){return `<div class="dbody"><div class="active-box"><div class="ab-head"><div class="ab-clock">🕐</div>
      <div style="flex:1"><div class="ab-title">Duty Active on ${sh.platform} <span class="ab-timer" id="liveTimer">0h 0m</span></div><div class="ab-meta">Logged in at ${sh.loginTime} on ${fmtDate(sh.date)} · 📡 Live location sharing ON</div></div></div>
    <div class="ab-acts"><button class="btn btn-outline" data-act="openFuel">⛽ Log Fuel Refill</button><button class="btn btn-outline" data-act="openKm">📊 Post Daily KMs</button></div>
    <button class="btn btn-primary btn-lg" style="margin-top:10px;background:var(--red);box-shadow:none" data-act="openEndDuty">➜ End Duty (Log Out)</button>
    <div class="ab-loc"><div class="abl-l">CHECK-IN LOCATION:</div><div class="abl-p">${sh.loginPlace}</div><div class="abl-a">${sh.loginAddr||""}</div><div class="rsub-odo" style="margin-top:12px"><span>Starting Odometer:</span><b>${km(sh.startOdo)} KM</b></div></div></div></div>`;}
function driverStats(d){const kmv=driverLifetimeKm(d.id);const done=driverShifts(d.id).filter(s=>s.status==="COMPLETED").length;const fuel=state.fuelRecords.filter(f=>f.driverId===d.id);const fk=fuel.reduce((a,f)=>a+(f.cost||0),0),fl=fuel.reduce((a,f)=>a+(f.liters||0),0);
  return `<div class="dstats"><div class="dstat"><div class="ds-l"><span class="i">⏱</span> Total KMs Logged</div><div class="ds-n">${km(kmv)} <small>KM</small></div><div class="ds-s">Recorded duty shifts</div></div>
    <div class="dstat"><div class="ds-l"><span class="i">🕐</span> Shifts Completed</div><div class="ds-n">${done}</div><div class="ds-s">Duty check-ins</div></div>
    <div class="dstat"><div class="ds-l"><span class="i">⛽</span> Fuel Spent</div><div class="ds-n">${money(fk)} <small>KWD</small></div><div class="ds-s">${fl.toFixed(1)} Liters total</div></div>
    <div class="dstat act"><button class="btn btn-d2" data-addkm="${d.id}">＋ Post Daily KM</button><button class="btn btn-primary" data-addfuel="${d.id}">＋ Log Fuel Refill</button></div></div>`;}
function driverRecords(d){const shifts=driverShifts(d.id).sort((a,b)=>b.startedAt-a.startedAt);const fuel=state.fuelRecords.filter(f=>f.driverId===d.id);
  const shiftCards=shifts.length?shifts.map(s=>`<div class="rec"><div class="rec-head"><div class="rec-title">${s.platform} Shift <span class="tag-plate">${d.plate}</span> <span class="st-badge ${s.status==="ACTIVE"?"st-active":"st-done"}">${s.status}</span></div><div class="rec-date">📅 ${fmtDate(s.date)} • Duration: <b>${s.duration||"0h 0m"}</b></div></div>
    <div class="rec-cols"><div class="rsub"><div class="rsub-head in">↗ LOGGED IN AT (${s.loginTime||"—"})</div><div class="rsub-place">${s.loginPlace||"—"}</div><div class="rsub-addr">${s.loginAddr||""}</div><div class="rsub-odo"><span>Start Odometer:</span><b>${km(s.startOdo)} KM</b></div></div>
      ${s.status==="ACTIVE"?`<div class="rsub"><div class="rsub-head out">↙ LOGOUT PENDING (ON DUTY)</div><div class="rsub-pending">Currently on road. Logout location captured when duty ends.</div></div>`:`<div class="rsub"><div class="rsub-head out">↙ LOGGED OUT AT (${s.logoutTime||"—"})</div><div class="rsub-place">${s.logoutPlace||"—"}</div><div class="rsub-addr">${s.logoutAddr||""}</div><div class="rsub-odo"><span>End Odometer:</span><b>${km(s.endOdo)} KM</b></div></div>`}</div>
    ${s.distance!=null||s.trips!=null?`<div class="rec-foot">${s.distance!=null?`<span class="dist">Distance: +${s.distance} KM</span>`:""}${s.trips!=null?`<span class="trips">Deliveries/Trips: ${s.trips}</span>`:""}</div>`:""}</div>`).join(""):emptyBox("No shifts yet — start a duty above.");
  const fuelCards=fuel.length?fuel.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(r=>`<div class="rec"><div class="rec-head"><div class="rec-title" style="font-size:14px">${r.station}</div><span class="st-badge st-active">${money(r.cost)} KWD</span></div><div class="rec-date" style="margin-top:4px">📍 ${r.place}</div>
    <div class="fc-grid" style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px"><div>Fuel Type<b style="font-family:var(--sans)">${r.fuelType}</b></div><div>Volume<b>${r.liters} L</b></div><div>Rate<b>${r.price} KWD/L</b></div><div>Odometer<b>${km(r.odo)} KM</b></div><div>Payment<b style="font-family:var(--sans)">${(r.payment||"").split(" (")[0]}</b></div><div>Receipt<b>${r.receipt||"—"}</b></div></div></div>`).join(""):emptyBox("No fuel records yet.");
  return `<div class="card pad" style="margin-top:16px"><div class="pilltabs"><button class="active" data-drtab="shifts">🕐 Shift & Location Records (${shifts.length})</button><button data-drtab="fuel">⛽ Fuel Refill Records (${fuel.length})</button></div><div id="drShifts">${shiftCards}</div><div id="drFuel" class="hidden">${fuelCards}</div></div>`;}

/* ---------- shared ---------- */
function hubMenu(kind){return `<div class="hubmenu hidden" id="hubs-${kind}"><div class="hm-t">SELECT DELIVERY / FLEET HUB:</div>${HUBS.map((h,i)=>`<button data-hubpick="${kind}:${i}">${h.name}<span>${h.lat.toFixed(2)}, ${h.lng.toFixed(2)}</span></button>`).join("")}</div>`;}
function gpsCard(g){return `<div class="gps-card"><div class="gc-head"><span class="gc-place">${g.place}</span><span class="badge-lock">✓ GPS Locked (±${g.acc}m)</span></div><div class="gc-addr">${g.addr}</div><div class="gc-foot"><span>LAT: ${g.lat} | LNG: ${g.lng}</span><span>${g.time}</span></div></div>`;}
function gpsPickerMini(kind){const g=state.gps[kind];const L={login:["Log In Location (GPS Duty Check-in)","Verified location where you start your duty today."],logout:["Log Out Location (Verified End Place)","Recorded location where you ended your shift."],fuel:["Gas Station Location","Recorded location where the vehicle refueled."]}[kind];
  return `<div class="gpsbox" id="${kind}Gps" style="margin-top:${kind==="login"?"18px":"0"}"><div class="gps-head"><div class="gps-ic">📍</div><div class="gh-t"><b>${L[0]}</b><span>${L[1]}</span></div>
    <div class="gps-actions"><button class="btn-gps" data-gpsdetect="${kind}">📡 GPS Detect</button><div style="position:relative"><button class="btn-hubs" data-hubstoggle="${kind}">Hubs ▾</button>${hubMenu(kind)}</div></div></div>
    ${g?gpsCard(g):`<div class="fhint" style="margin-top:12px">Tap “GPS Detect” to lock your real location, or choose a Hub.</div>`}</div>`;}
function footer(){return `<div class="foot"><span><b>SUMOU FLEET</b> • Duty, GPS Check-in & Fuel Operations</span><span>Real-time live multi-device fleet platform</span></div>`;}
function emptyBox(msg){return `<div class="empty"><div class="eic">📭</div><p>${msg}</p></div>`;}

/* ============================================================ MODALS ============================================================ */
function openModal(html){const o=document.createElement("div");o.className="overlay";o.id="overlay";o.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(o);o.addEventListener("click",e=>{if(e.target===o)closeModal();});}
function closeModal(){const o=$("#overlay");if(o)o.remove();}
function modalAddDriver(){openModal(`<div class="m-head"><div class="m-ic">👤</div><div><h3>Register New Fleet Driver</h3><p>Add a driver & assigned vehicle</p></div><button class="x" data-close>×</button></div>
  <div class="m-body"><label class="fld">Driver Full Name:</label><input id="ndName" placeholder="e.g. Youssef Al-Husseini" />
    <div class="grid2"><div><label class="fld">Phone Number:</label><input id="ndPhone" value="+965 " /></div><div><label class="fld">Login PIN (4 digits):</label><input id="ndPin" maxlength="4" value="1234" /></div></div>
    <div class="grid2"><div><label class="fld">Vehicle Plate:</label><input id="ndPlate" placeholder="e.g. 54321 KWT" /></div><div><label class="fld">Vehicle Model:</label><input id="ndModel" placeholder="e.g. Toyota Yaris 2024" /></div></div>
    <label class="fld">Assigned Delivery / Ride Platforms:</label><div class="checks">${PLATFORMS.map(p=>`<label><input type="checkbox" class="ndPlat" value="${p}" checked> ${p}</label>`).join("")}</div></div>
  <div class="m-foot"><button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" data-act="saveDriver">✓ Register Driver</button></div>`);}
function modalPostKm(id){const d=driverById(id);const s=lastOdometer(id);openModal(`<div class="m-head"><div class="m-ic">📊</div><div><h3>Post Daily KM Record</h3><p>Driver: ${d.name} • Vehicle: ${d.plate}</p></div><button class="x" data-close>×</button></div>
  <div class="m-body"><label class="fld">Shift Date:</label><input id="kmDate" type="date" value="${today()}" /><label class="fld">Online Platform:</label><select id="kmPlatform">${(d.platforms||PLATFORMS).map(p=>`<option>${p}</option>`).join("")}</select>
    <div class="grid2"><div><label class="fld">Starting Odometer (KM):</label><input id="kmStart" type="number" value="${s}" /></div><div><label class="fld">Ending Odometer (KM):</label><input id="kmEnd" type="number" value="${s+145}" /></div></div>
    <div class="calc"><div><div class="c-l">TOTAL DAILY DISTANCE:</div><div class="c-s">Calculated for this date</div></div><div class="c-v" id="kmDist">145 KM</div></div>
    <label class="fld">Trips / Deliveries Completed:</label><input id="kmTrips" type="number" value="18" /><label class="fld">Shift Notes:</label><input id="kmNote" value="Daily delivery shift KM log" /></div>
  <div class="m-foot"><button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" data-act="saveKm" data-driver="${id}">✓ Post KM Record</button></div>`);
  const u=()=>{$("#kmDist").textContent=((+$("#kmEnd").value||0)-(+$("#kmStart").value||0))+" KM";};$("#kmStart").oninput=u;$("#kmEnd").oninput=u;}
function modalFuel(id){const d=driverById(id);state.gps.fuel=null;openModal(`<div class="m-head"><div class="m-ic amber">⛽</div><div><h3>Post Daily Fuel Refilling Record</h3><p>Driver: ${d.name} • Plate: ${d.plate}</p></div><button class="x" data-close>×</button></div>
  <div class="m-body"><label class="fld">Fuel Station / Brand:</label><select id="fStation">${STATIONS.map(s=>`<option>${s}</option>`).join("")}</select><label class="fld">Payment Method:</label><select id="fPay">${PAYMENTS.map(p=>`<option>${p}</option>`).join("")}</select>
    <label class="fld">Fuel Type:</label><select id="fType">${FUEL_TYPES.map(t=>`<option value="${t.price}">${t.label} (${t.price} KWD)</option>`).join("")}</select>
    <div class="grid2"><div><label class="fld">Liters (L):</label><input id="fLiters" type="number" value="35" /></div><div><label class="fld">Total Cost (KWD):</label><input id="fCost" value="2.975" readonly style="font-family:var(--mono);font-weight:700;background:var(--green-tint);border-color:#cdeede" /></div></div>
    <label class="fld">Vehicle Odometer at Refuel (KM):</label><input id="fOdo" type="number" value="${lastOdometer(id)}" /><div class="fhint">Used to compute vehicle fuel efficiency (KM per Liter).</div>
    <label class="fld">Receipt / Invoice Ref #:</label><input id="fReceipt" value="REC-${Math.floor(100000+Math.random()*900000)}" />
    <label class="fld">Gas Station Location:</label>${gpsPickerMini("fuel")}<label class="fld">Notes (Optional):</label><input id="fNote" value="Full tank refilled" /></div>
  <div class="m-foot"><button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" data-act="saveFuel" data-driver="${id}">✓ Save Fuel Record</button></div>`);
  const u=()=>{$("#fCost").value=((+$("#fLiters").value||0)*(+$("#fType").value)).toFixed(3);};$("#fLiters").oninput=u;$("#fType").onchange=u;u();}
function modalEndDuty(id){const d=driverById(id);const sh=activeShift(id);state.gps.logout=null;openModal(`<div class="m-head"><div class="m-ic red">➜</div><div><h3>Duty Log Out & Daily KM Confirmation</h3><p>Driver: ${d.name}</p></div><button class="x" data-close>×</button></div>
  <div class="m-body"><label class="fld">Ending Odometer (KM):</label><input id="edOdo" type="number" value="${sh.startOdo+85}" /><div class="fhint">Start: ${km(sh.startOdo)} KM</div>
    <div class="calc"><div><div class="c-l">TOTAL DISTANCE DRIVEN:</div><div class="c-s">Computed for this shift</div></div><div class="c-v" id="edDist">+85 KM</div></div>
    <label class="fld">Orders / Trips Completed:</label><input id="edTrips" type="number" value="12" /><label class="fld">Log Out Location (Verified End Place):</label>${gpsPickerMini("logout")}<label class="fld">Shift Summary Notes:</label><input id="edNote" placeholder="e.g. Smooth shift, no incidents" /></div>
  <div class="m-foot"><button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" style="background:var(--red);box-shadow:none" data-act="confirmEndDuty" data-driver="${id}">➜ Confirm & Log Out Duty</button></div>`);
  const u=()=>{$("#edDist").textContent="+"+((+$("#edOdo").value||0)-sh.startOdo)+" KM";};$("#edOdo").oninput=u;}

/* ============================================================ ACTIONS (async → Supabase) ============================================================ */
async function doAddDriver(){const name=$("#ndName").value.trim();if(!name)return toast("Driver name is required.");
  const plats=[...document.querySelectorAll(".ndPlat:checked")].map(c=>c.value);
  const {data,error}=await sb.from("drivers").insert({name,phone:$("#ndPhone").value.trim(),pin:($("#ndPin").value||"1234").slice(0,4),plate:($("#ndPlate").value.trim()||"00000 KWT").toUpperCase(),model:$("#ndModel").value.trim()||"Vehicle",platforms:plats.length?plats:["Talabat"]}).select().single();
  if(error){toast("Error: "+error.message);return;}
  const i=state.drivers.findIndex(x=>x.id===data.id);const md=mapDriver(data);if(i>=0)state.drivers[i]=md;else state.drivers.push(md);
  closeModal();toast("Driver registered ✓");render();}
async function doStartDuty(){const d=driverById(state.driverId);if(!state.gps.login)return toast("Tap “GPS Detect” to lock your location first (or pick a Hub).");const g=state.gps.login;
  const {data,error}=await sb.from("shifts").insert({driver_id:d.id,platform:$("#dPlatform").value,date:today(),status:"ACTIVE",start_odo:+$("#dStartOdo").value||lastOdometer(d.id),login_time:g.time,login_place:g.place,login_addr:g.addr,login_lat:g.lat,login_lng:g.lng,live_lat:g.lat,live_lng:g.lng,live_time:g.time,started_at:new Date().toISOString(),pre_note:$("#dNote").value.trim()}).select().single();
  if(error){toast("Error: "+error.message);return;}
  const ms=mapShift(data);const i=state.shifts.findIndex(x=>x.id===ms.id);if(i>=0)state.shifts[i]=ms;else state.shifts.push(ms);
  state.gps.login=null;toast("Duty started — you are ON DUTY ✓ Live location sharing.");render();}
async function doSaveKm(id){const s=+$("#kmStart").value||0,e=+$("#kmEnd").value||0,d=driverById(id);
  const {data,error}=await sb.from("km_records").insert({driver_id:id,plate:d.plate,platform:$("#kmPlatform").value,date:$("#kmDate").value,start_odo:s,end_odo:e,distance:e-s,trips:+$("#kmTrips").value||0,note:$("#kmNote").value}).select().single();
  if(error){toast("Error: "+error.message);return;}
  const mk=mapKm(data);if(!state.kmRecords.find(x=>x.id===mk.id))state.kmRecords.push(mk);closeModal();toast("Daily KM posted ✓");render();}
async function doSaveFuel(id){if(!state.gps.fuel)return toast("Set the gas station location (GPS Detect or Hub).");const g=state.gps.fuel,d=driverById(id);const price=+$("#fType").value,liters=+$("#fLiters").value||0;
  const {data,error}=await sb.from("fuel_records").insert({driver_id:id,plate:d.plate,station:$("#fStation").value,payment:$("#fPay").value,fuel_type:$("#fType").selectedOptions[0].textContent.split(" (")[0],price,liters,cost:liters*price,odo:+$("#fOdo").value||0,receipt:$("#fReceipt").value,place:g.place,lat:g.lat,lng:g.lng,note:$("#fNote").value,date:today(),time:nowTime()}).select().single();
  if(error){toast("Error: "+error.message);return;}
  const mf=mapFuel(data);if(!state.fuelRecords.find(x=>x.id===mf.id))state.fuelRecords.push(mf);state.gps.fuel=null;closeModal();toast("Fuel record saved ✓");render();}
async function doEndDuty(id){const sh=activeShift(id);if(!state.gps.logout)return toast("Set your logout location (GPS Detect or Hub).");const g=state.gps.logout;const end=+$("#edOdo").value||sh.startOdo;const mins=Math.max(1,Math.round((Date.now()-sh.startedAt)/60000));
  const upd={status:"COMPLETED",end_odo:end,distance:end-sh.startOdo,trips:+$("#edTrips").value||0,logout_time:g.time,logout_place:g.place,logout_addr:g.addr,logout_lat:g.lat,logout_lng:g.lng,duration:`${Math.floor(mins/60)}h ${mins%60}m`,summary:$("#edNote").value};
  const {error}=await sb.from("shifts").update(upd).eq("id",sh.id);
  if(error){toast("Error: "+error.message);return;}
  Object.assign(sh,mapShift({...upd,id:sh.id,driver_id:id,platform:sh.platform,date:sh.date,start_odo:sh.startOdo,login_time:sh.loginTime,login_place:sh.loginPlace,login_addr:sh.loginAddr,login_lat:sh.loginLat,login_lng:sh.loginLng,started_at:new Date(sh.startedAt).toISOString()}));
  await sb.from("km_records").insert({driver_id:id,plate:driverById(id).plate,platform:sh.platform,date:sh.date,start_odo:sh.startOdo,end_odo:end,distance:end-sh.startOdo,trips:upd.trips,note:upd.summary});
  stopLiveWatch();state.gps.logout=null;closeModal();toast("Duty completed — logged out ✓");await loadAll();render();}
async function doDeleteDriver(id){if(!confirm("Remove this driver and ALL their records?"))return;const {error}=await sb.from("drivers").delete().eq("id",id);if(error){toast("Error: "+error.message);return;}await loadAll();toast("Driver removed");render();}
async function doClearData(){if(!confirm("Clear ALL drivers, shifts, KM and fuel records? This cannot be undone."))return;
  await sb.from("fuel_records").delete().not("id","is",null);await sb.from("km_records").delete().not("id","is",null);await sb.from("shifts").delete().not("id","is",null);await sb.from("drivers").delete().not("id","is",null);
  await loadAll();toast("All data cleared");render();}
function exportCsv(rows,fn){const csv=rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=fn;a.click();toast("Exported "+fn);}
function doExportAll(){const rows=[["Type","Driver","Plate","Platform","Date","Detail1","Detail2","Detail3"]];state.shifts.forEach(s=>{const d=driverById(s.driverId);rows.push(["Shift",d?.name,d?.plate,s.platform,s.date,`In:${s.loginPlace}`,`Out:${s.logoutPlace||"pending"}`,`Dist:${s.distance??"-"}`]);});state.fuelRecords.forEach(f=>{const d=driverById(f.driverId);rows.push(["Fuel",d?.name,f.plate,"-",f.date,`${f.liters}L ${f.fuelType}`,`${money(f.cost)} KWD`,f.station]);});exportCsv(rows,"sumou-fleet-export.csv");}
function doExportKm(){const rows=[["Date","Driver","Plate","Platform","Start KM","End KM","Distance","Trips"]];state.kmRecords.forEach(r=>{const d=driverById(r.driverId);rows.push([r.date,d?.name,r.plate,r.platform,r.startOdo,r.endOdo??"-",r.distance??"-",r.trips??"-"]);});exportCsv(rows,"sumou-km-report.csv");}

/* ============================================================ EVENTS ============================================================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-role],[data-act],[data-tab],[data-addkm],[data-addfuel],[data-deldriver],[data-drtab],[data-gpsdetect],[data-hubstoggle],[data-hubpick],[data-map],[data-close]");
  if(!t)return;
  if(t.hasAttribute("data-close")){closeModal();return;}
  if(t.dataset.role){state.role=t.dataset.role;render();return;}
  if(t.dataset.tab){state.adminTab=t.dataset.tab;document.querySelectorAll(".tabgroup button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t.dataset.tab));paintAdmin();return;}
  if(t.dataset.drtab){const sh=t.dataset.drtab;$("#drShifts").classList.toggle("hidden",sh!=="shifts");$("#drFuel").classList.toggle("hidden",sh!=="fuel");t.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b===t));return;}
  if(t.dataset.addkm){modalPostKm(t.dataset.addkm);return;}
  if(t.dataset.addfuel){modalFuel(t.dataset.addfuel);return;}
  if(t.dataset.deldriver){doDeleteDriver(t.dataset.deldriver);return;}
  if(t.dataset.map){const[la,ln]=t.dataset.map.split(",");if(la&&la!=="null")window.open(`https://www.openstreetmap.org/?mlat=${la}&mlon=${ln}#map=15/${la}/${ln}`,"_blank");return;}
  if(t.dataset.gpsdetect){detectGps(t.dataset.gpsdetect);return;}
  if(t.dataset.hubstoggle){const m=$("#hubs-"+t.dataset.hubstoggle);if(m)m.classList.toggle("hidden");return;}
  if(t.dataset.hubpick){const[k,i]=t.dataset.hubpick.split(":");setHubGps(k,+i);return;}
  const a=t.dataset.act;if(!a)return;
  switch(a){
    case "adminLogin":if($("#adminPass").value===ADMIN_PASSCODE){state.screen="admin";render();}else toast("Wrong passcode. Try 9999.");break;
    case "driverLogin":{const id=$("#driverSelect").value,d=driverById(id);if(!d){toast("Select a driver.");break;}if($("#driverPin").value!==d.pin){toast("Incorrect PIN for "+d.name);break;}state.driverId=id;state.screen="driver";render();break;}
    case "logout":stopLiveWatch();state.screen="landing";state.driverId=null;state.gps={};render();break;
    case "openAddDriver":modalAddDriver();break;
    case "saveDriver":doAddDriver();break;
    case "startDuty":doStartDuty();break;
    case "openKm":modalPostKm(state.driverId);break;
    case "openFuel":modalFuel(state.driverId);break;
    case "openEndDuty":modalEndDuty(state.driverId);break;
    case "saveKm":doSaveKm(t.dataset.driver);break;
    case "saveFuel":doSaveFuel(t.dataset.driver);break;
    case "confirmEndDuty":doEndDuty(t.dataset.driver);break;
    case "exportCsv":doExportAll();break;
    case "exportKm":doExportKm();break;
    case "clearData":doClearData();break;
  }
});
document.addEventListener("input",e=>{if(e.target.id==="fSearch"){state.filters.search=e.target.value;paintAdmin();}});
document.addEventListener("change",e=>{
  if(e.target.id==="fDriver"){state.filters.driver=e.target.value;paintAdmin();}
  if(e.target.id==="fPlatform"){state.filters.platform=e.target.value;paintAdmin();}
  if(e.target.id==="fStatus"){state.filters.status=e.target.value;paintAdmin();}});

/* ============================================================ BOOT ============================================================ */
(async function boot(){
  try{
    await loadAll();
    state.ready=true;
    subscribeRealtime();
    render();
  }catch(err){
    console.error(err);
    app.innerHTML=`<div class="wrap"><div class="land"><div class="land-hero"><div class="logo">🚚</div><h1>SUMOU FLEET</h1></div>
      <div class="card pad"><div class="note admin">⚠️ Could not connect to the database. Make sure you ran the SQL setup in Supabase, and that the URL/key are correct.<br><br><b>Error:</b> ${(err&&err.message)||err}</div>
      <button class="btn btn-dark btn-lg" onclick="location.reload()">Retry</button></div></div></div>`;
  }
})();
</script>
</body>
</html>
