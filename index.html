  if(D2.map){try{D2.map.remove();}catch(e){}D2.map=null;D2.mapMe=null;D2.mapLine=null;}
  if(!d2mode())return;
  requestAnimationFrame(function(){requestAnimationFrame(function(){var r=document.getElementById("qRing");if(r)r.style.strokeDashoffset=r.getAttribute("data-off");});});
  d2bindSlides();
  if(state.screen==="driver"){
    var sh=activeShift(state.driverId);
    if(sh&&document.getElementById("qMap"))d2mountMap(sh);
    D2.tick=setInterval(function(){d2tick();},1000);
    if(state.driverTab==="home")d2loadHome();
  }
}
function d2tick(){
  var k=d2kw();Array.prototype.forEach.call(document.querySelectorAll("[data-q-clk]"),function(el){var v=k[el.getAttribute("data-q-clk")];if(v!=null&&el.textContent!==v)el.textContent=v;});
  var sh=activeShift(state.driverId);if(!sh)return;
  var t=document.getElementById("qT");if(t){var x=d2dur(Date.now()-sh.startedAt);t.innerHTML=x[0]+":"+x[1]+'<span class="s">:'+x[2]+'</span>';}
  var r=document.getElementById("qRing");if(r){var c=+r.getAttribute("stroke-dasharray");r.style.strokeDashoffset=(c*(1-Math.min(1,(Date.now()-sh.startedAt)/(12*3600e3)))).toFixed(1);}
  var b=document.getElementById("qBrk");if(b&&sh.breakAt){var y=d2dur(Date.now()-sh.breakAt);b.textContent=(y[0]!=="00"?y[0]+":":"")+y[1]+":"+y[2];}
  var g=document.getElementById("qGkm");if(g)g.innerHTML=d2gpsKm(sh.id).toFixed(1)+"<small>km</small>";
  var sp=document.getElementById("dialSpeed");if(sp&&live.last&&Date.now()-live.last.t<30000)sp.textContent=live.last.kmh;
  if(D2.map&&D2.mapMe){var p=live.last?[live.last.lat,live.last.lng]:(sh.liveLat?[sh.liveLat,sh.liveLng]:null);if(p){var cur=D2.mapMe.getLatLng();if(Math.abs(cur.lat-p[0])>1e-6||Math.abs(cur.lng-p[1])>1e-6){D2.mapMe.setLatLng(p);D2.mapLine.addLatLng(p);D2.map.panTo(p,{animate:true});}}}
}
function d2mountMap(sh){
  if(!window.L||!L.map)return;var el=document.getElementById("qMap");
  var p=live.last?[live.last.lat,live.last.lng]:(sh.liveLat?[sh.liveLat,sh.liveLng]:(sh.loginLat?[sh.loginLat,sh.loginLng]:[29.3375,48.0]));
  try{D2.map=L.map(el,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,keyboard:false,boxZoom:false,tap:false}).setView(p,15);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19}).addTo(D2.map);
    D2.mapLine=L.polyline(sh.loginLat?[[sh.loginLat,sh.loginLng],p]:[p],{color:getComputedStyle(document.body).getPropertyValue("--acc").trim()||"#C2410C",weight:4,dashArray:"7 7",opacity:.8}).addTo(D2.map);
    D2.mapMe=L.marker(p,{icon:L.divIcon({className:"",html:'<div class="q-me"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(D2.map);
    setTimeout(function(){try{D2.map&&D2.map.invalidateSize();}catch(e){}},200);
  }catch(e){}
}
function d2bindSlides(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-q-slide]"),function(el){
    var th=el.querySelector(".thumb"),fill=el.querySelector(".fill"),start=null,max=0,x=0,rtl=D2.lang==="ar";
    function down(e){start=e.clientX;max=el.clientWidth-th.offsetWidth-12;el.classList.add("drag");try{th.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();}
    function move(e){if(start==null)return;x=Math.max(0,Math.min(max,(e.clientX-start)*(rtl?-1:1)));th.style.left=(rtl?(max-x+6):(6+x))+"px";fill.style.width=(x+60)+"px";}
    function up(){if(start==null)return;start=null;el.classList.remove("drag");
      if(x>max*.8){th.style.left=(rtl?6:6+max)+"px";el.classList.add("done");try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){}
        setTimeout(function(){if(el.getAttribute("data-q-slide")==="start")modalStartDuty();else modalEndDuty();},240);
        setTimeout(function(){el.classList.remove("done");th.style.left=(rtl?(max+6):6)+"px";fill.style.width="0";},900);}
      else{th.style.left=(rtl?(max+6):6)+"px";fill.style.width="0";}x=0;}
    if(rtl)th.style.left=(el.clientWidth-th.offsetWidth-6)+"px";
    th.addEventListener("pointerdown",down);th.addEventListener("pointermove",move);th.addEventListener("pointerup",up);th.addEventListener("pointercancel",up);
    el.addEventListener("click",function(e){if(e.target.closest(".thumb"))return;th.animate([{transform:"translateX(0)"},{transform:"translateX("+(rtl?-14:14)+"px)"},{transform:"translateX(0)"}],{duration:420,easing:"ease-out"});});
  });
}

/* ================= EVENTS ================= */
function d2themeMenu(btn){
  var old=document.querySelector(".q-tmenu");if(old){old.remove();return;}
  var r=btn.getBoundingClientRect(),m=document.createElement("div");m.className="q-tmenu";m.setAttribute("role","menu");
  m.innerHTML='<div class="t q-lbl">'+qe(tt("theme"))+'</div>'+D2SKINS.map(function(s){var on=s[0]===D2.skin;return '<button class="'+(on?"on":"")+'" data-d2skin="'+s[0]+'"><span class="sw" style="background:'+d2sw(s)+'"></span><span><b>'+s[1]+'</b><small>'+s[4]+'</small></span>'+(on?'<span class="ck">'+qi("check",18)+'</span>':"")+'</button>';}).join("");
  m.style.top=(r.bottom+8)+"px";m.style.left=Math.max(8,Math.min(innerWidth-258,r.right-250))+"px";document.body.appendChild(m);
}
function d2setSkin(s){D2.skin=s;try{localStorage.setItem("d2-skin",s);}catch(e){}var m=document.querySelector(".q-tmenu");if(m)m.remove();d2soft();}
function d2setLang(l){D2.lang=l;try{localStorage.setItem("d2-lang",l);}catch(e){}var ph=document.getElementById("dlPhone");if(ph)D2.phone=ph.value;d2soft();}
function d2saveOrders(sh){clearTimeout(D2.orderT);D2.orderT=setTimeout(function(){rpc("driver_set_orders",{p_token:state.token,p_shift:String(sh.id),p_done:sh.ordersDone||0,p_cancel:sh.ordersCancelled||0}).catch(function(){});},700);}
function d2pinKey(k){
  var pin=document.getElementById("dlPin");if(!pin||D2.pinBusy)return;var v=pin.value;
  if(k==="del")v=v.slice(0,-1);else if(v.length<4)v+=k;pin.value=v;D2.pinLen=v.length;
  var dots=document.querySelectorAll("#qPins i");Array.prototype.forEach.call(dots,function(d,i){d.classList.toggle("f",i<v.length);});
  var er=document.getElementById("loginErr");if(er){er.style.display="none";}
  if(v.length===4){D2.pinBusy=true;var go=document.querySelector('[data-act="driverLogin"]');if(go)go.click();
    var t0=Date.now(),iv=setInterval(function(){
      if(state.screen!=="landing"){clearInterval(iv);D2.pinBusy=false;D2.pinLen=0;toast(tt("welcome"));return;}
      var e=document.getElementById("loginErr");
      if((e&&!e.classList.contains("hidden"))||Date.now()-t0>20000){clearInterval(iv);D2.pinBusy=false;if(e)e.style.display="block";
        var ps=document.getElementById("qPins");if(ps){ps.classList.remove("shake");void ps.offsetWidth;ps.classList.add("shake");}
        var p2=document.getElementById("dlPin");if(p2)p2.value="";D2.pinLen=0;Array.prototype.forEach.call(document.querySelectorAll("#qPins i"),function(d){d.classList.remove("f");});
        var gb=document.querySelector('[data-act="driverLogin"]');if(gb)gb.disabled=false;}
    },250);}
}
document.addEventListener("click",function(e){
  if(!d2mode())return;
  var t=e.target.closest("[data-d2],[data-d2k],[data-d2lang],[data-d2skin],[data-d2lead],[data-d2station],[data-d2amt],[data-d2sost],[data-d2chk],[data-d2lt],[data-d2step],[data-plat],[data-mplat]");
  if(!t){var m=document.querySelector(".q-tmenu");if(m&&!e.target.closest(".q-tmenu"))m.remove();return;}
  var v;
  if((v=t.getAttribute("data-d2k"))){d2pinKey(v);return;}
  if((v=t.getAttribute("data-d2lang"))){d2setLang(v);return;}
  if((v=t.getAttribute("data-d2skin"))){d2setSkin(v);return;}
  if((v=t.getAttribute("data-d2lead"))){D2.lead=v;render();return;}
  if(t.hasAttribute("data-plat")){Array.prototype.forEach.call(document.querySelectorAll(".q-seg [data-plat]"),function(b){b.classList.toggle("on",b===t);});return;}
  if(t.hasAttribute("data-mplat"))return;
  if((v=t.getAttribute("data-d2station"))){var hs=document.getElementById("fuStation");if(hs)hs.value=v;Array.prototype.forEach.call(document.querySelectorAll("[data-d2station]"),function(b){b.classList.toggle("on",b===t);});return;}
  if((v=t.getAttribute("data-d2amt"))){var fc=document.getElementById("fuCost");if(fc)fc.value=v;Array.prototype.forEach.call(document.querySelectorAll("[data-d2amt]"),function(b){b.classList.toggle("on",b===t);});return;}
  if((v=t.getAttribute("data-d2sost"))){D2.sosType=v;Array.prototype.forEach.call(document.querySelectorAll("[data-d2sost]"),function(b){b.classList.toggle("on",b===t);});return;}
  if((v=t.getAttribute("data-d2lt"))){D2.leaveType=v;Array.prototype.forEach.call(document.querySelectorAll("[data-d2lt]"),function(b){b.classList.toggle("on",b===t);});return;}
  if((v=t.getAttribute("data-d2chk"))){var a=v.split(":");D2.chk[a[0]]=a[1]==="1";var g=t.parentNode;Array.prototype.forEach.call(g.children,function(b){b.classList.toggle("on",b===t);});return;}
  if((v=t.getAttribute("data-d2step"))){var s=v.split(":"),inp=document.getElementById(s[0]);if(inp)inp.value=Math.max(0,(+inp.value||0)+(+s[1]));return;}
  var act=t.getAttribute("data-d2"),sh=activeShift(state.driverId);
  if(act==="menu"){e.stopPropagation();d2themeMenu(t);return;}
  if(act==="notif"){d2notifSheet();return;}
  if(act==="check"){d2checkSheet();return;}
  if(act==="checkSave"){d2checkSave(t);return;}
  if(act==="leave"){d2leaveSheet();return;}
  if(act==="leaveSave"){d2leaveSave(t);return;}
  if(act==="sos"){d2sosSheet();return;}
  if(act==="break"&&sh){t.disabled=true;rpc("driver_break",{p_token:state.token,p_shift:String(sh.id),p_on:!sh.breakAt}).then(function(r){var ms=mapShift(r),i=state.shifts.findIndex(function(x){return String(x.id)===String(ms.id);});if(i>=0)state.shifts[i]=ms;toast(ms.breakAt?tt("on_break"):tt("live_gps"));d2soft();}).catch(function(err){t.disabled=false;toast(err.message||String(err));});return;}
  if((act==="ordPlus"||act==="ordMinus")&&sh){
    sh.ordersDone=Math.max(0,(sh.ordersDone||0)+(act==="ordPlus"?1:-1));var n=document.getElementById("qOrd");if(n){n.textContent=sh.ordersDone;n.classList.remove("q-bump");void n.offsetWidth;n.classList.add("q-bump");}
    try{if(navigator.vibrate)navigator.vibrate(12);}catch(_){}
    if(act==="ordPlus"){var card=t.closest(".q-card"),f=document.createElement("span");f.className="q-plus1";f.textContent="+1";var r=t.getBoundingClientRect(),pr=card.getBoundingClientRect();f.style.left=(r.left-pr.left+16)+"px";f.style.top=(r.top-pr.top-6)+"px";card.appendChild(f);setTimeout(function(){f.remove();},800);}
    d2saveOrders(sh);return;}
});
document.addEventListener("keydown",function(e){if(!d2mode()||state.screen!=="landing")return;if(document.activeElement&&document.activeElement.id==="dlPhone")return;if(/^[0-9]$/.test(e.key))d2pinKey(e.key);else if(e.key==="Backspace")d2pinKey("del");});
/* re-draw once with the new screens if the app already painted the old ones */
if(state.ready)render();
</script>
</body>
