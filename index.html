<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Sumou Fleet — Driver Telemetry HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --sans:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;
    --display:'Outfit',-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --bg-page:#0a0b0f; --card-bg:#12141a; --card-inner:#181a22; --tile-bg:#0d0f15;
    --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.14); --border-accent:rgba(245,158,11,.4);
    --amber:#f59e0b; --amber-2:#fbbf24; --amber-glow:rgba(245,158,11,.28); --amber-tint:rgba(245,158,11,.12);
    --green:#10b981; --green-ink:#34d399; --green-tint:rgba(16,185,129,.14);
    --blue:#3b82f6; --blue-ink:#60a5fa; --blue-tint:rgba(37,99,235,.14);
    --violet:#a78bfa; --violet-tint:rgba(167,139,250,.14);
    --txt-white:#f8fafc; --txt-muted:#94a3b8; --txt-dim:#64748b;
    --red-bg:rgba(239,68,68,.12); --red-border:rgba(239,68,68,.35); --red-txt:#fca5a5; --red:#ef4444;
    --shadow:0 4px 20px rgba(0,0,0,.4); --shadow2:0 10px 40px rgba(0,0,0,.7);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;min-height:100vh;min-height:100dvh;background:var(--bg-page);color:var(--txt-white);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  body{display:flex;flex-direction:column;align-items:center;}
  .hidden{display:none !important;}
  svg.i{display:inline-block;vertical-align:middle;width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  svg.i-xs{width:13px;height:13px;stroke-width:2;}
  svg.i-lg{width:20px;height:20px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-family:var(--mono);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--card-inner);color:var(--txt-white);transition:.18s;}
  .btn:active{transform:scale(.97);}
  .btn-amber{background:linear-gradient(135deg,var(--amber-2),#d97706);color:#0c0d12;border:none;box-shadow:0 4px 16px var(--amber-glow);font-weight:900;}
  .btn-blue{background:#2563eb;border-color:#3b82f6;color:#fff;}
  .btn-ghost{background:var(--tile-bg);}
  .btn-ghost:hover{border-color:var(--border-accent);}
  .btn-red{background:var(--red-bg);border-color:var(--red-border);color:var(--red-txt);}
  .btn-block{width:100%;}
  input,select,textarea{width:100%;height:42px;background:var(--tile-bg);border:1px solid var(--border);border-radius:10px;padding:0 12px;color:var(--txt-white);font-family:var(--mono);font-size:13.5px;outline:none;transition:.18s;}
  textarea{height:auto;padding:10px 12px;font-family:var(--sans);}
  input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-glow);}
  input::placeholder{color:var(--txt-dim);}
  select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--txt-dim) 50%),linear-gradient(135deg,var(--txt-dim) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;}
  label.fld{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;font-family:var(--mono);color:var(--txt-dim);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px;}
  label.fld:first-child{margin-top:0;}
  .fhint{font-size:11px;color:var(--txt-dim);margin-top:6px;font-family:var(--mono);}
  #app{width:100%;display:flex;flex-direction:column;align-items:center;flex:1;}
  .loading{display:grid;place-items:center;min-height:80vh;color:var(--txt-muted);text-align:center;font-family:var(--mono);font-size:13px;width:100%;}
  .spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#181b24;border:1px solid var(--amber);color:#fff;padding:10px 18px;border-radius:22px;font-size:12.5px;font-weight:700;font-family:var(--mono);box-shadow:var(--shadow2);z-index:3000;pointer-events:none;transition:.28s cubic-bezier(.16,1,.3,1);max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- DRIVER COCKPIT ---------- */
  .cockpit{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;gap:8px;position:relative;
    padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}
  @media(min-width:520px){
    body{justify-content:flex-start;padding:16px 0 80px;}
    .cockpit{min-height:auto;border:1px solid var(--border);border-radius:24px;background:var(--card-bg);box-shadow:var(--shadow2);padding:14px 16px 78px;}
  }
  .header-bar{display:flex;align-items:center;justify-content:space-between;padding-bottom:7px;border-bottom:1px solid var(--border);}
  .brand-side{display:flex;align-items:center;gap:8px;}
  .brand-icon{width:32px;height:32px;border-radius:10px;background:#1e222d;border:1px solid var(--border-accent);color:var(--amber);display:grid;place-items:center;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
  .brand-title{font-family:var(--display);font-weight:900;font-size:14px;line-height:1.1;letter-spacing:.3px;display:flex;align-items:center;gap:5px;}
  .hud-badge{font-family:var(--mono);font-size:9px;font-weight:800;color:var(--amber);background:var(--amber-tint);border:1px solid var(--border-accent);padding:1px 5px;border-radius:5px;}
  .driver-sub{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt-muted);margin-top:2px;}
  .driver-sub .dn{font-weight:700;color:#e2e8f0;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{opacity:.6}50%{opacity:1;transform:scale(1.1)}100%{opacity:.6}}
  .header-actions{display:flex;align-items:center;gap:6px;}
  .veh-chip{display:flex;align-items:center;gap:4px;padding:4px 7px;border-radius:8px;background:#181b24;border:1px solid var(--border);font-size:10.5px;color:var(--txt-muted);}
  .veh-chip b{font-family:var(--mono);color:var(--amber);}
  .btn-logout{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:9px;background:var(--red-bg);border:1px solid var(--red-border);color:var(--red-txt);font-size:11px;font-weight:700;font-family:var(--sans);cursor:pointer;white-space:nowrap;}
  .dispatch-strip{background:#161820;border:1px solid var(--border);border-radius:12px;padding:5px 7px;display:flex;align-items:center;justify-content:space-between;}
  .dispatch-label{font-family:var(--mono);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-dim);display:flex;align-items:center;gap:5px;padding-left:3px;}
  .platform-btns{display:flex;gap:5px;}
  .btn-p{padding:5px 13px;border-radius:8px;border:1px solid var(--border);background:#11131a;color:var(--txt-muted);font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;transition:.18s;}
  .btn-p.active{background:var(--amber);color:#0d0e12;border-color:var(--amber);font-weight:800;box-shadow:0 2px 10px var(--amber-glow);}
  .btn-p.locked{opacity:.6;cursor:default;}
  .cockpit-card{background:var(--card-inner);border:1px solid var(--border);border-radius:16px;padding:9px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;}
  .twin-gauges{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .gauge-tile{background:var(--tile-bg);border:1px solid var(--border);border-radius:12px;padding:9px;transition:.2s;position:relative;}
  .gauge-tile.tap{cursor:pointer;}.gauge-tile.tap:active{transform:scale(.98);}
  .gauge-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--txt-dim);}
  .gauge-head .lbl{display:flex;align-items:center;gap:4px;}
  .gauge-head .lbl svg{color:var(--amber);}
  .gauge-value{font-family:var(--mono);font-size:19px;font-weight:900;color:var(--amber);margin-top:3px;display:flex;align-items:baseline;gap:3px;letter-spacing:-.5px;}
  .gauge-value small{font-size:10px;font-weight:700;color:var(--txt-muted);}
  .gauge-sub{font-size:9px;color:var(--txt-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);}
  .active-duty-banner{display:none;align-items:center;justify-content:space-between;background:rgba(245,158,11,.14);border:1px solid var(--border-accent);border-radius:9px;padding:5px 9px;font-family:var(--mono);font-size:10.5px;color:#fde68a;}
  .active-duty-banner.show{display:flex;}
  .banner-left{display:flex;align-items:center;gap:6px;font-weight:800;}
  .ping-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.4s infinite;}
  .timer-clock{font-weight:900;letter-spacing:.8px;color:#fff;}
  .btn-launch{width:100%;height:46px;border-radius:13px;border:none;font-family:var(--mono);font-size:13.5px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.22s;background:linear-gradient(135deg,var(--amber-2),#d97706);color:#0c0d12;box-shadow:0 4px 18px var(--amber-glow);}
  .btn-launch:active{transform:scale(.98);}
  .btn-launch.duty-on{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 4px 20px rgba(239,68,68,.45);}
  .btn-fuel-lg{width:100%;height:38px;border-radius:11px;border:1px solid var(--border-accent);background:var(--amber-tint);color:var(--amber);font-family:var(--mono);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;}
  .telemetry-card{background:var(--card-inner);border:1px solid var(--border);border-radius:15px;padding:9px;display:flex;flex-direction:column;gap:7px;}
  .telemetry-title{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-dim);padding:0 2px;}
  .telemetry-title .dt{color:var(--amber);}
  .stats-triplet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
  .stat-pill{background:var(--tile-bg);border:1px solid var(--border);border-radius:11px;padding:7px 3px;text-align:center;}
  .stat-pill .label{font-size:9px;font-weight:600;color:var(--txt-muted);font-family:var(--mono);}
  .stat-pill .num{font-family:var(--mono);font-size:15.5px;font-weight:900;color:var(--txt-white);margin-top:1px;}
  .stat-pill.amber .num{color:var(--amber);}
  .stat-pill .num span{font-size:9px;font-weight:600;color:var(--txt-dim);}
  .stat-pill .sub-tag{font-size:8.5px;font-family:var(--mono);color:var(--txt-dim);}
  .trail-card{background:var(--card-inner);border:1px solid var(--border);border-radius:15px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;flex:1;}
  .trail-header{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;}
  .trail-title{display:flex;align-items:center;gap:5px;color:var(--txt-white);}
  .trail-title svg{color:var(--amber);}
  .trail-badge{font-family:var(--mono);font-size:8.5px;font-weight:800;background:var(--amber-tint);border:1px solid var(--border-accent);color:var(--amber);padding:1px 6px;border-radius:10px;}
  .trail-badge.live{background:var(--green-tint);border-color:rgba(16,185,129,.4);color:var(--green-ink);}
  .waypoints-box{background:var(--tile-bg);border:1px solid var(--border);border-radius:11px;padding:8px 10px;font-family:var(--mono);font-size:10px;display:flex;flex-direction:column;justify-content:space-around;gap:6px;flex:1;}
  .wp-point{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .wp-point .point-info{display:flex;align-items:center;gap:5px;color:var(--txt-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wp-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0;}
  .wp-dot.green{background:var(--green);}.wp-dot.orange{background:#fb923c;}
  .wp-km{font-weight:700;color:var(--txt-white);white-space:nowrap;margin-left:auto;}
  .wp-km.hl{color:var(--amber);}
  .wp-connector{font-size:9px;color:var(--txt-dim);padding-left:11px;border-left:2px dashed rgba(255,255,255,.1);margin-left:2px;}
  .trail-footer{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);padding-top:2px;}
  .trail-footer b{color:var(--amber);}
  .trail-footer .lf{display:flex;align-items:center;gap:4px;}.trail-footer .lf svg{color:var(--amber);}

  /* ---------- driver history tab ---------- */
  .dpage{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;gap:10px;
    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}
  @media(min-width:520px){.dpage{max-width:480px;}}
  .page-head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 0;}
  .page-head h2{font-family:var(--display);font-size:18px;font-weight:900;}
  .day-group{margin-top:4px;}
  .day-label{font-family:var(--mono);font-size:10px;font-weight:800;color:var(--amber);text-transform:uppercase;letter-spacing:.6px;margin:6px 2px 6px;display:flex;align-items:center;gap:6px;}
  .rec{background:var(--card-inner);border:1px solid var(--border);border-radius:13px;padding:11px;margin-bottom:8px;}
  .rec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap;}
  .rec-title{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--txt-white);flex-wrap:wrap;}
  .tag-plate{font-family:var(--mono);font-size:10px;font-weight:700;background:#181b24;color:var(--txt-muted);border:1px solid var(--border);padding:1px 6px;border-radius:6px;letter-spacing:.5px;}
  .st-badge{font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:10px;text-transform:uppercase;}
  .st-active{background:var(--green-tint);color:var(--green-ink);border:1px solid rgba(16,185,129,.4);}
  .st-done{background:#181b24;color:var(--txt-muted);border:1px solid var(--border);}
  .flag{background:var(--red-bg);color:var(--red-txt);border:1px solid var(--red-border);font-family:var(--mono);font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:10px;display:inline-flex;align-items:center;gap:3px;}
  .rec-meta{font-family:var(--mono);font-size:10.5px;color:var(--txt-muted);display:flex;flex-direction:column;gap:3px;}
  .rec-meta .row{display:flex;align-items:center;gap:5px;}
  .rec-meta b{color:var(--txt-white);}.rec-meta .amber{color:var(--amber);}.rec-meta .green{color:var(--green-ink);}
  .photo-strip{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  .photo-thumb{width:52px;height:52px;border-radius:9px;border:1px solid var(--border);object-fit:cover;cursor:pointer;background:var(--tile-bg);}
  .photo-tag{font-family:var(--mono);font-size:8px;color:var(--txt-dim);text-align:center;margin-top:2px;}
  .photo-wrap{display:flex;flex-direction:column;align-items:center;}
  .fuel-line{background:var(--tile-bg);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-top:8px;display:flex;align-items:center;gap:9px;}
  .fuel-line .fl-m{flex:1;min-width:0;font-family:var(--mono);font-size:10.5px;color:var(--txt-muted);}
  .fuel-line .fl-m b{color:var(--txt-white);}

  /* ---------- bottom tab bar ---------- */
  .tabbar{position:fixed;bottom:0;left:0;right:0;height:62px;background:rgba(18,20,26,.96);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;z-index:900;padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:480px;margin:0 auto;width:100%;display:flex;}
  .tabbar button{flex:1;background:transparent;border:0;color:var(--txt-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--mono);font-size:10px;font-weight:700;cursor:pointer;transition:.15s;}
  .tabbar button svg{width:21px;height:21px;}
  .tabbar button.active{color:var(--amber);}

  /* ---------- AUTH ---------- */
  .authgate{width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));}
  .authcard{width:100%;max-width:380px;background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow2);}
  .authbrand{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .authbrand .logo-box{width:44px;height:44px;border-radius:12px;background:#1e222d;border:1px solid var(--border-accent);color:var(--amber);display:grid;place-items:center;box-shadow:0 4px 14px var(--amber-glow);}
  .authbrand .ab-text b{font-family:var(--display);font-size:17px;font-weight:900;color:var(--txt-white);letter-spacing:.5px;display:block;line-height:1.2;}
  .authbrand .ab-text small{font-family:var(--mono);font-size:10px;color:var(--amber);font-weight:700;letter-spacing:.5px;}
  .authcard h2{font-family:var(--display);font-size:18px;font-weight:800;color:var(--txt-white);margin-bottom:4px;}
  .authsub{font-size:11.5px;color:var(--txt-muted);margin-bottom:16px;line-height:1.5;}
  .authnote{text-align:center;font-size:10.5px;color:var(--txt-dim);margin-top:14px;font-family:var(--mono);}
  .autherr{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red-txt);padding:8px 10px;border-radius:8px;font-size:11px;margin-bottom:12px;}
  .infobox{background:var(--amber-tint);border:1px solid var(--border-accent);color:#fbd38d;border-radius:10px;padding:11px;font-size:11.5px;line-height:1.5;margin-bottom:14px;display:flex;gap:8px;}
  .infobox svg{color:var(--amber);margin-top:1px;}

  /* ---------- ADMIN ---------- */
  .admin{width:100%;max-width:1160px;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:13px;margin:0 auto;}
  .admin-appbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card-bg);border:1px solid var(--border);border-radius:16px;gap:10px;flex-wrap:wrap;}
  .admin-brand{display:flex;align-items:center;gap:10px;}
  .admin-brand .logo-box{width:38px;height:38px;border-radius:11px;background:#172554;border:1px solid rgba(59,130,246,.5);color:var(--blue-ink);display:grid;place-items:center;}
  .admin-brand .t b{font-family:var(--display);font-size:16px;font-weight:900;letter-spacing:.4px;display:inline;}
  .admin-badge{font-family:var(--mono);font-size:9.5px;font-weight:800;color:var(--blue-ink);background:var(--blue-tint);border:1px solid rgba(59,130,246,.35);padding:2px 7px;border-radius:6px;margin-left:6px;}
  .admin-brand .t small{display:block;font-size:11px;color:var(--txt-muted);margin-top:2px;}
  .admin-appbar-r{display:flex;align-items:center;gap:10px;}
  .admin-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px;}
  .admin-kpi{background:var(--card-inner);border:1px solid var(--border);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;}

/* Admin: logged in with Supabase Auth, reads tables directly (allowed by RLS for admins only) */
async function loadAdmin(){
  const [d,s,f]=await Promise.all([
    sb.from("drivers").select("*").order("created_at"),
    sb.from("shifts").select("*").order("created_at"),
    sb.from("fuel_records").select("*").order("created_at"),
  ]);
  if(d.error||s.error||f.error){console.error(d.error||s.error||f.error);throw (d.error||s.error||f.error);}
  state.drivers=(d.data||[]).map(mapDriver);
  state.shifts=(s.data||[]).map(mapShift);
  state.fuelRecords=(f.data||[]).map(mapFuel);
}

async function loadDriver(){
  const {data,error}=await sb.rpc("driver_bootstrap",{p_token:state.token});
  if(error)throw error;
  state.drivers=data&&data.driver?[mapDriver(data.driver)]:[];
  state.shifts=((data&&data.shifts)||[]).map(mapShift);
  state.fuelRecords=((data&&data.fuel)||[]).map(mapFuel);
  state.driverId=data&&data.driver?data.driver.id:null;
}

function friendly(m){m=m||"";for(const k in ERRMSG)if(m.includes(k))return ERRMSG[k];return m;}
async function rpc(fn,args){
  const {data,error}=await sb.rpc(fn,args);

let rtChan=null;
function subscribeRealtime(){if(rtChan)return;rtChan=sb.channel("sumou-admin");
  ["drivers","shifts","fuel_records","shift_points"].forEach(t=>rtChan.on("postgres_changes",{event:"*",schema:"public",table:t},onRealtime));
  rtChan.subscribe();}
function unsubscribeRealtime(){if(rtChan){try{sb.removeChannel(rtChan);}catch(e){}rtChan=null;}}
function applyChange(table,ev,nw,oldRow){
  const cfg={drivers:["drivers",mapDriver],shifts:["shifts",mapShift],fuel_records:["fuelRecords",mapFuel]}[table];
  if(!cfg)return;const [arrName,mapper]=cfg;const arr=state[arrName];
  if(ev==="DELETE"){const id=oldRow&&oldRow.id;const i=arr.findIndex(x=>String(x.id)===String(id));if(i>=0)arr.splice(i,1);return;}
  const row=mapper(nw);const i=arr.findIndex(x=>String(x.id)===String(row.id));if(i>=0)arr[i]=row;else arr.push(row);
}
let renderT=null;
function scheduleRender(){clearTimeout(renderT);renderT=setTimeout(()=>{
  if($("#overlay"))return;const ae=document.activeElement;
  if(ae&&["INPUT","SELECT","TEXTAREA"].includes(ae.tagName))return;render();},450);}
function onRealtime(p){
  if(state.screen!=="admin")return;
  /* new route point → extend that driver's trail line */
  if(p.table==="shift_points"){if(p.eventType==="INSERT"&&p.new)addTrailPoint(p.new.shift_id,p.new.lat,p.new.lng);return;}
  /* live GPS ping on a running shift → just move the marker (NO full re-render, map keeps its zoom) */
  if(p.table==="shifts"&&p.eventType==="UPDATE"&&p.new){
    const prev=state.shifts.find(x=>String(x.id)===String(p.new.id));
    if(prev&&prev.status==="ACTIVE"&&p.new.status==="ACTIVE"){applyChange(p.table,p.eventType,p.new,p.old);onLiveMove(p.new.id);return;}
  }
  applyChange(p.table,p.eventType,p.new,p.old);
  scheduleRender();
}

const photoBuf={};
function compressImage(file){return new Promise((res,rej)=>{
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height,max=1100;if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error("compress failed")),"image/jpeg",0.68);};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"));};img.src=url;});}

/* ============================================================ GPS ============================================================ */
async function reverseGeocode(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat=${lat}&lon=${lng}`,{headers:{"Accept":"application/json"}});
    const j=await r.json();const a=j.address||{};
    const place=a.neighbourhood||a.suburb||a.city_district||a.quarter||a.road||a.city||a.town||a.village||j.name||"Current Location";
    const city=a.city||a.town||a.state||"Kuwait";
    return {place,addr:j.display_name?j.display_name.split(",").slice(0,3).join(", "):`${place}, ${city}`};
  }catch(e){return {place:"Current Location",addr:`${(+lat).toFixed(5)}, ${(+lng).toFixed(5)}`};}
}
/* One location fix, tried 3 ways so clock-in works indoors too:
   1) precise GPS (15 s)  2) WiFi / mobile-network location (15 s)
   3) the app's native GPS plugin (APK only; also asks for permission) */
let gpsDiag=[];
function getFix(){gpsDiag=[];return new Promise((res,rej)=>{
  let done=false;const T0=Date.now();const note=(m,e)=>gpsDiag.push(m+":"+(e?(e.code!=null?"code"+e.code:"")+(e.message?" "+String(e.message).slice(0,40):""):"ok")+" "+((Date.now()-T0)/1000).toFixed(0)+"s");const ok=(lat,lng,acc,how)=>{if(!done){done=true;res({lat,lng,acc:Math.max(1,Math.round(acc||25)),how});}};
  const fail=e=>{if(!done){done=true;rej(e||{code:2});}};
  const G=navigator.geolocation;
  const capTry=prev=>{
    if(!CapGeo)return bgTry(prev);
    (async()=>{try{
      try{const p=await CapGeo.checkPermissions();if(p.location!=="granted"){const r=await CapGeo.requestPermissions();if(r.location==="denied"){note("capgeo",{code:1,message:"denied"});return fail({code:1});}}}catch(e){}
      const pos=await CapGeo.getCurrentPosition({enableHighAccuracy:true,timeout:20000,maximumAge:30000});
      ok(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy,"capgeo");
    }catch(e){note("capgeo",{message:e&&e.message||String(e)});bgTry(prev);}})();
  };
  const nativeTry=prev=>capTry(prev);
  /* clock-in one-shot fix relies on precise GPS + WiFi + @capacitor/geolocation; SumouTracker
     only does the continuous on-duty streaming, so there is no native one-shot here */
  const bgTry=prev=>{note("native",{message:"no one-shot provider"});return fail(prev);};
  const coarse=prev=>{
    if(!G)return nativeTry(prev);
    G.getCurrentPosition(p=>ok(p.coords.latitude,p.coords.longitude,p.coords.accuracy,"network"),
      e=>{note("wifi",e);nativeTry(e.code===1?e:prev);},{enableHighAccuracy:false,timeout:15000,maximumAge:300000});
  };
  if(!G){note("web",{message:"no navigator.geolocation"});return nativeTry({code:2});}
  G.getCurrentPosition(p=>ok(p.coords.latitude,p.coords.longitude,p.coords.accuracy,"gps"),
    e=>{note("gps",e);e.code===1?nativeTry(e):coarse(e);},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
});}
let gpsBusy={},gpsWait={},gpsMsg={};
async function detectGps(kind){
  /* on duty the phone already has a fresh fix from live tracking — use it straight away */
  if(live.last&&Date.now()-live.last.t<20000){const f=live.last;
    reverseGeocode(f.lat,f.lng).then(g=>{state.gps[kind]={place:g.place,addr:g.addr,lat:+f.lat.toFixed(6),lng:+f.lng.toFixed(6),acc:Math.max(1,f.acc||15),time:nowTime(),src:"gps"};refreshGps(kind);});
    return;}
  if(gpsBusy[kind])return gpsWait[kind];
  gpsBusy[kind]=Date.now();gpsMsg[kind]=null;refreshGps(kind);
  const tick=setInterval(()=>{const el=$("#gpsSecs-"+kind);if(el)el.textContent=Math.round((Date.now()-gpsBusy[kind])/1000)+"s";},1000);
  let resolveWait;gpsWait[kind]=new Promise(r=>resolveWait=r);
  try{
    const f=await getFix();
    const g=await reverseGeocode(f.lat,f.lng);
    state.gps[kind]={place:g.place,addr:g.addr,lat:+f.lat.toFixed(6),lng:+f.lng.toFixed(6),acc:f.acc,time:nowTime(),src:"gps"};
    refreshGps(kind);toast(f.acc>100?"Location found (approx. ±"+f.acc+" m) ✓":"GPS locked ✓");
  }catch(err){
    const c=err&&err.code;
    gpsMsg[kind]=c===1?"Location permission is OFF. Open phone Settings → Apps → this app → Permissions → Location → Allow, then tap GPS."
         :c===2?"Phone Location is turned OFF. Swipe down, turn on Location, then tap GPS."
         :"No signal yet. Step near a window or outside and tap GPS again, or pick a Hub.";
    let perm="?";try{if(navigator.permissions){const q=await navigator.permissions.query({name:"geolocation"});perm=q.state;}}catch(e){perm="n/a";}
    gpsMsg[kind]+=`<div style="margin-top:8px;font-family:var(--mono);font-size:10px;opacity:.85;word-break:break-word">Details for support: app=${isNativeApp?"native":"browser"} · capacitor=${window.Capacitor?"yes":"no"} · tracker=${SGT?"yes":"no"} · geo-plugin=${CapGeo?"yes":"no"} · plugins=${(()=>{try{return Object.keys(window.Capacitor&&window.Capacitor.Plugins||{}).join(",")||"none";}catch(e){return "?";}})()} · permission=${perm} · https=${location.protocol} · ${gpsDiag.join(" | ")}</div>`;
    toast("Location not found — see details in the box");
  }finally{clearInterval(tick);gpsBusy[kind]=false;refreshGps(kind);resolveWait();}
}
function setHubGps(kind,i){const h=HUBS[i];state.gps[kind]={place:h.name,addr:h.addr,lat:h.lat,lng:h.lng,acc:15,time:nowTime(),src:"hub"};refreshGps(kind);toast("Hub location set ✓");}
function refreshGps(kind){const el=$("#"+kind+"Gps");if(el)el.innerHTML=gpsPickerMini(kind);if(kind==="login")updateDriverGps();}

function updateDriverGps(){
  if(state.screen!=="driver"||state.driverTab!=="home")return;
  const sp=$("#dialSpeed");if(!sp)return;const tl=$("#trailLive");
  const sh=activeShift(state.driverId);
  if(sh){sp.textContent=sh.speed||0;if(tl)tl.textContent="Live: "+(sh.loginPlace||"On road");}
  else{sp.textContent="0";if(tl)tl.textContent="GPS ready";}

/* ------------------------------------------------------------------
   LIVE TRACKING — why it looked frozen before:
   1) every GPS write came back through realtime and re-rendered the driver
      screen, and each re-render STOPPED and restarted the GPS watcher, so the
      phone kept sending its first / cached fix instead of real movement;
   2) it only sent every 7 s and the admin map re-zoomed out to fit all pins;
   3) native background tracking ignored moves under 8 m.
   Now: one watcher for the whole shift, sends as soon as the driver moves
   ~3-5 m (max every 2 s), a heartbeat every 15 s when standing still,
   every move is saved as a route point, and offline points are queued.
   ------------------------------------------------------------------ */
function haversine(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dLat=r(c-a),dLng=r(d-b);const s=Math.sin(dLat/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
const live={shiftId:null,watchId:null,hb:null,last:null,sent:null,busy:false,pending:null,starting:false,queue:[],flushing:false,native:false};

/* ---- SumouTracker native background tracking: our own foreground-service plugin POSTs each
        fix straight to the Supabase RPC from native code, so it keeps working with the app
        minimised / screen off / OS-frozen. In native mode JS only updates the on-screen dial. ---- */
const LIVE_URL=SUPABASE_URL+"/rest/v1/rpc/driver_update_live";
function startLiveWatch(shiftId){
  if(String(live.shiftId)===String(shiftId)&&(live.native||live.watchId!=null))return; /* already tracking this shift */
  stopLiveWatch();live.shiftId=shiftId;
  if(SGT){
    live.native=true;
    try{ SGT.start({url:LIVE_URL,apikey:SUPABASE_ANON_KEY,token:state.token,shiftId:String(shiftId),interval:10000}); }catch(e){}
    startWebWatch();               /* foreground-only: keeps the speed dial live while the app is open (native service does the server posting) */
    return;
  }
  startWebWatch();
  live.hb=setInterval(()=>{if(live.last)pushLive(true);},15000);
}
function startWebWatch(){
  if(!navigator.geolocation){toast("GPS not supported on this device.");return;}
  acquireWake();
  live.watchId=navigator.geolocation.watchPosition(
    p=>{const c=p.coords;onFix(c.latitude,c.longitude,c.accuracy,c.heading,c.speed);},
    e=>{if(e.code===1)toast("Location permission denied — live tracking is OFF. Allow location in settings.");},
    {enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
function onFix(lat,lng,acc,heading,spd){
  if(lat==null||lng==null||!live.shiftId)return;
  const now=Date.now();acc=Math.round(acc||0);
  if(acc>100&&live.sent&&now-live.sent.t<30000)return;               /* skip very poor fixes */
  let kmh=(spd!=null&&spd>=0)?spd*3.6:null;
  if(kmh==null&&live.last){const dt=(now-live.last.t)/1000;if(dt>0)kmh=haversine(live.last.lat,live.last.lng,lat,lng)/dt*3.6;}
  kmh=Math.max(0,Math.min(200,Math.round(kmh||0)));
  live.last={lat,lng,acc,heading:(heading!=null&&!isNaN(heading))?Math.round(heading):null,kmh,t:now};
  const moved=live.sent?haversine(live.sent.lat,live.sent.lng,lat,lng):Infinity;
  const minMove=Math.max(3,Math.min(acc*0.4,15));                    /* walking pace shows up */
  if(moved>=minMove&&(!live.sent||now-live.sent.t>=2000))pushLive(false);
  else if(!live.sent||now-live.sent.t>=15000)pushLive(true);
  updateDriverGps();
}
async function pushLive(heartbeat){
  if(live.native)return; /* native (transistorsoft) mode posts directly from the plugin — no JS POST */
  const Lf=live.last,sid=live.shiftId;if(!Lf||!sid||!state.token)return;
  if(live.busy){live.pending=(live.pending==="pt"||!heartbeat)?"pt":"hb";return;}
  live.busy=true;
  const p={lat:+Lf.lat.toFixed(6),lng:+Lf.lng.toFixed(6),acc:Lf.acc,speed:Lf.kmh,heading:Lf.heading,time:nowTime()};
  live.sent={lat:Lf.lat,lng:Lf.lng,t:Date.now()};
  const sh=state.shifts.find(s=>String(s.id)===String(sid));
  if(sh){sh.liveLat=p.lat;sh.liveLng=p.lng;sh.speed=p.speed;sh.lastPing=p.time;sh.liveAt=Date.now();}
  try{
    const {error}=await sb.rpc("driver_update_live",{p_token:state.token,p_shift:String(sid),p,p_point:!heartbeat});
    if(error){
      const m=error.message||"";
      if(/NO_ACTIVE_SHIFT/.test(m)){stopLiveWatch();loadDriver().then(render).catch(()=>{});}
      else if(/SESSION_EXPIRED/.test(m))forceDriverLogout(ERRMSG.SESSION_EXPIRED);
      else if(!heartbeat)queuePoint(p);
    }else if(live.queue.length)flushQueue();
  }catch(e){if(!heartbeat)queuePoint(p);}
  finally{live.busy=false;const pn=live.pending;live.pending=null;if(pn)pushLive(pn==="hb");}
}
function queuePoint(p){live.queue.push({...p,at:new Date().toISOString()});if(live.queue.length>500)live.queue.shift();}
async function flushQueue(){
  if(live.flushing||!live.queue.length||!live.shiftId)return;live.flushing=true;
  const batch=live.queue.splice(0,100);
  try{const {error}=await sb.rpc("driver_add_points",{p_token:state.token,p_shift:String(live.shiftId),p_pts:batch});if(error)live.queue.unshift(...batch);}
  catch(e){live.queue.unshift(...batch);}
  live.flushing=false;
}
function stopLiveWatch(){
  if(SGT&&live.native){try{SGT.stop();}catch(e){}}
  if(live.watchId!=null){try{navigator.geolocation.clearWatch(live.watchId);}catch(e){}}
  if(live.hb)clearInterval(live.hb);
  Object.assign(live,{shiftId:null,watchId:null,hb:null,last:null,sent:null,busy:false,pending:null,starting:false,native:false});
  releaseWake();
}

      data.forEach(r=>onLiveMove(r.id));}}catch(e){}

let wakeLock=null;
async function acquireWake(){try{if("wakeLock" in navigator)wakeLock=await navigator.wakeLock.request("screen");}catch(e){}}

/* command-center helpers */
function ringSvg(pct,color,text){const off=(150.8*(1-Math.max(0,Math.min(pct,1)))).toFixed(1);
  return `<div class="ring"><svg width="56" height="56"><circle cx="28" cy="28" r="24" stroke="rgba(255,255,255,.08)" stroke-width="6" fill="none"/><circle cx="28" cy="28" r="24" stroke="${color}" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="${off}"/></svg><div class="rc" style="color:${color}">${text}</div></div>`;}
function donutSvg(done,canc){const tot=(done+canc)||1;const off=(150.8*(1-done/tot)).toFixed(1);
  return `<div class="ring"><svg width="56" height="56"><circle cx="28" cy="28" r="24" stroke="var(--red)" stroke-width="6" fill="none" stroke-dasharray="150.8"/><circle cx="28" cy="28" r="24" stroke="#34d399" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="${off}"/></svg><div class="rc" style="font-size:11px">${done}</div></div>`;}
function last7(){const a=[];for(let i=6;i>=0;i--){const day=kwDate(new Date(Date.now()-i*86400000));a.push(completedShifts().filter(s=>s.date===day).reduce((x,s)=>x+(s.distance||0),0));}return a;}
function spark(){const a=last7(),mx=Math.max(...a,1);return `<div class="spark">${a.map(v=>`<span style="height:${Math.max(6,Math.round(v/mx*32))}px"></span>`).join("")}</div>`;}
function timeAgo(ms){if(!ms)return "";const d=Date.now()-ms,m=Math.floor(d/60000);if(m<1)return "just now";if(m<60)return m+"m ago";const h=Math.floor(m/60);if(h<24)return h+"h ago";return Math.floor(h/24)+"d ago";}
function ccFeed(){const ev=[];
  state.shifts.forEach(s=>{const d=driverById(s.driverId);
    if(s.status==="ACTIVE")ev.push({t:s.startedAt,cls:"in",ft:`<b>${d?.name||"Driver"}</b> clocked in · ${s.loginPlace||"—"}`,fm:`${s.loginSrc==="hub"?"Hub picked (not GPS) · ":""}ODO ${km(s.startOdo)} · photo verified`});
    else ev.push({t:s.startedAt,cls:"out",ft:`<b>${d?.name||"Driver"}</b> clocked out · +${s.distance||0} KM`,fm:`${s.ordersDone||0} orders · ${s.ordersCancelled||0} cancel · ${s.duration||""}`});});
  state.fuelRecords.forEach(f=>{const d=driverById(f.driverId);ev.push({t:(Date.parse(f.date)||0),cls:"fuel",ft:`<b>${d?.name||"Driver"}</b> logged fuel · ${money(f.cost)} KWD`,fm:`${f.station} · receipt attached`});});
  ev.sort((a,b)=>b.t-a.t);const top=ev.slice(0,7);
  if(!top.length)return `<div class="live-empty">No activity yet.</div>`;
  return top.map(e=>`<div class="fitem"><div class="fic ${e.cls}">${ic(e.cls==="fuel"?"fuel":e.cls==="in"?"check":"logout","i-xs")}</div><div><div class="ft">${e.ft}</div><div class="fm">${e.fm}</div></div><div class="ft-time">${timeAgo(e.t)}</div></div>`).join("");}
function ccLeaderboard(){const map={},fm={};
  completedShifts().filter(s=>s.date===today()).forEach(s=>{const m=map[s.driverId]=map[s.driverId]||{km:0,ord:0};m.km+=s.distance||0;m.ord+=s.ordersDone||0;});
  state.fuelRecords.filter(f=>f.date===today()).forEach(f=>{fm[f.driverId]=(fm[f.driverId]||0)+(f.cost||0);});
  let arr=Object.keys(map).map(id=>({d:driverById(id),km:map[id].km,ord:map[id].ord,eff:fm[id]?(map[id].km/fm[id]).toFixed(1):"—"}));

function hubShiftsToday(){return state.shifts.filter(s=>s.date===today()&&(s.loginSrc==="hub"||s.logoutSrc==="hub"));}
function longShifts(){return onDutyShifts().filter(s=>Date.now()-s.startedAt>14*3600000);}
function noFuelDrivers(){return state.drivers.filter(d=>{const ds=driverShifts(d.id).filter(s=>s.status==="COMPLETED");const fu=state.fuelRecords.filter(f=>f.driverId===d.id);return ds.length>=3&&fu.length===0;});}
function ccAlerts(){const items=[];

  longShifts().forEach(s=>{const d=driverById(s.driverId);items.push(`<div class="alert"><div class="at">${ic('clock','i-xs')} Shift open 14h+ · ${d?d.name:"Driver"}</div><div class="am">Clocked in ${timeAgo(s.startedAt)}. Probably forgot to clock out — use "End shift" in On Duty Now.</div></div>`);});
  hubShiftsToday().slice(0,3).forEach(s=>{const d=driverById(s.driverId);items.push(`<div class="alert"><div class="at">${ic('pin','i-xs')} Hub picked instead of GPS · ${d?d.name:"Driver"}</div><div class="am">Check-in/out location was chosen from the hub list, not detected by GPS.</div></div>`);});
  noFuelDrivers().slice(0,3).forEach(d=>{items.push(`<div class="alert"><div class="at">${ic('alert','i-xs')} No fuel logged · ${d.name}</div><div class="am">${driverShifts(d.id).filter(s=>s.status==="COMPLETED").length} shifts, zero fuel entries.</div></div>`);});

  return items.join("")+`<div style="font-family:var(--mono);font-size:10px;color:var(--txt-dim);margin-top:6px;text-align:center">Odometer photos auto-flag suspicious readings</div>`;}
function ccAlertsCount(){return flaggedShifts().length+noFuelDrivers().length+longShifts().length+hubShiftsToday().length;}
function passFilter(sh){const f=state.filters,d=driverById(sh.driverId);

function adminSection(){return {map:secMap,logs:secLogs,km:secKm,fuel:secFuel,drivers:secDrivers}[state.adminTab]();}
function paintAdmin(){const el=$("#adminSection");if(!el)return;el.innerHTML=adminSection();state.adminTab==="map"?mountMap():teardownMap();}

const STALE_MS=120000; /* no ping for 2 min = GPS lost */
const isStale=s=>!s.liveAt||Date.now()-s.liveAt>STALE_MS;
function ago(ms){if(!ms)return "no GPS yet";const sec=Math.max(0,Math.round((Date.now()-ms)/1000));if(sec<60)return sec+"s ago";const m=Math.floor(sec/60);if(m<60)return m+"m ago";return Math.floor(m/60)+"h "+(m%60)+"m ago";}
function livePanelInner(){

        <div class="sub"><b style="color:var(--amber)">${s.platform}</b> · ${st?"":`<span class="spd">${s.speed||0} km/h</span> · `}updated ${ago(s.liveAt)}${s.liveAcc?` · ±${Math.round(s.liveAcc)} m`:""}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">

}

let lpT=null;function refreshLivePanelSoon(){if(lpT)return;lpT=setTimeout(()=>{lpT=null;refreshLivePanel();},400);}
function secMap(){return `
  <div class="cc-main">
    <div class="admin-card"><div class="sec-head"><div><h3>${ic('pin','i-xs')} Live Fleet Map</h3><p>Amber pulse = live driver · amber line = route since clock-in · grey = GPS lost. Tap <b>Follow</b> to zoom in and track one driver.</p></div><span class="badge-count ${onDutyShifts().length?"green":""}">${onDutyShifts().length} moving</span></div>
      <div class="mapholder"><div class="map-legend"><span class="lg"><span class="lgd" style="background:var(--green)"></span>Login</span><span class="sep"></span><span class="lg"><span class="lgd" style="background:var(--red)"></span>Logout</span><span class="sep"></span><span class="lg"><span class="lgd" style="background:var(--amber)"></span>Live</span></div><div id="leafmap"></div></div></div>
    <div class="admin-card"><div class="sec-head"><h3>${ic('nav','i-xs')} On Duty Now</h3><span class="badge-count ${onDutyShifts().length?"green":""}">${onDutyShifts().length} live</span></div><div id="livePanel">${livePanelInner()}</div></div>

    <div class="admin-card"><div class="sec-head"><h3>${ic('trend','i-xs')} Top Drivers Today</h3><span class="badge-count">by KM</span></div>${ccLeaderboard()}</div>
    <div class="admin-card"><div class="sec-head"><h3>${ic('alert','i-xs')} Needs Review</h3><span class="badge-count" style="color:var(--red-txt);border-color:rgba(239,68,68,.3);background:var(--red-bg)">${ccAlertsCount()} flags</span></div>${ccAlerts()}</div>

let liveMarkers={},trails={},LMAP=null,mapView=null;
function pinIcon(kind){const inner=`<span>${kind==="in"?"↓":"↑"}</span>`;return L.divIcon({className:"",html:`<div class="mpin ${kind}">${inner}</div>`,iconSize:[32,32],iconAnchor:[16,30]});}
function liveIcon(name,stale){return L.divIcon({className:"",html:`<div class="mpin live ${stale?"stale":""}"><span class="ring"></span><span>●</span></div><div class="mlabel">${(name||"Driver").split(" ")[0]}</div>`,iconSize:[32,32],iconAnchor:[16,16]});}
function teardownMap(){if(LMAP){try{mapView={c:LMAP.getCenter(),z:LMAP.getZoom()};LMAP.remove();}catch(e){}LMAP=null;liveMarkers={};trails={};}}
function mountMap(){
  const el=$("#leafmap");if(!el)return;
  if(typeof L==="undefined"){el.innerHTML=`<div style="height:100%;display:grid;place-items:center;background:var(--tile-bg);color:var(--txt-muted);font-size:13px;text-align:center;padding:20px;font-family:var(--mono)">Map is loading… check internet.</div>`;return;}
  if(LMAP){try{LMAP.remove();}catch(e){}LMAP=null;liveMarkers={};trails={};}
  LMAP=L.map(el,{scrollWheelZoom:true}).setView([29.32,47.98],11);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"}).addTo(LMAP);
  const bounds=[],td=today();
  /* only TODAY's login / logout pins, so old pins don't bury the live drivers */
  state.shifts.filter(passFilter).filter(s=>s.date===td).forEach(s=>{
    if(s.loginLat!=null){L.marker([s.loginLat,s.loginLng],{icon:pinIcon("in")}).addTo(LMAP).bindPopup(`<b>Login</b><br>${s.loginPlace||""}${s.loginSrc==="hub"?"<br><i>Hub picked, not GPS</i>":""}`);bounds.push([s.loginLat,s.loginLng]);}
    if(s.logoutLat!=null){L.marker([s.logoutLat,s.logoutLng],{icon:pinIcon("out")}).addTo(LMAP).bindPopup(`<b>Logout</b><br>${s.logoutPlace||""}`);bounds.push([s.logoutLat,s.logoutLng]);}
  });
  onDutyShifts().filter(passFilter).forEach(s=>{addLiveMarker(s);const lat=s.liveLat??s.loginLat;if(lat!=null)bounds.push([lat,s.liveLng??s.loginLng]);});
  if(mapView)LMAP.setView(mapView.c,mapView.z,{animate:false});        /* keep the admin's zoom between refreshes */
  else if(bounds.length)LMAP.fitBounds(bounds,{padding:[50,50],maxZoom:16});
  LMAP.on("dragstart",()=>{if(state.follow){state.follow=null;refreshLivePanel();}});
  LMAP.on("moveend",()=>{if(LMAP)mapView={c:LMAP.getCenter(),z:LMAP.getZoom()};});
  loadTrails();
  setTimeout(()=>{if(LMAP)LMAP.invalidateSize();},60);
}
function addLiveMarker(s){
  if(!LMAP)return;const lat=s.liveLat??s.loginLat,lng=s.liveLng??s.loginLng;if(lat==null)return;
  const d=driverById(s.driverId);const st=isStale(s);
  const m=L.marker([lat,lng],{icon:liveIcon(d?.name,st),zIndexOffset:1000}).addTo(LMAP)
    .bindPopup(()=>{const x=state.shifts.find(y=>String(y.id)===String(s.id))||s;return `<b>${d?.name||"Driver"}</b><br>${x.platform} · ${x.speed||0} km/h<br>updated ${ago(x.liveAt)}`;});
  m._stale=st;liveMarkers[s.id]=m;
}
async function loadTrails(){
  const ids=onDutyShifts().map(s=>String(s.id));if(!ids.length||!LMAP)return;
  const {data,error}=await sb.from("shift_points").select("shift_id,lat,lng,recorded_at").in("shift_id",ids).order("recorded_at",{ascending:true}).limit(10000);
  if(error||!data||!LMAP)return;
  const by={};data.forEach(p=>{(by[p.shift_id]=by[p.shift_id]||[]).push([p.lat,p.lng]);});
  Object.keys(by).forEach(sid=>{const ll=by[sid];const sh=state.shifts.find(s=>String(s.id)===sid);if(sh&&sh.liveLat!=null)ll.push([sh.liveLat,sh.liveLng]);
    if(trails[sid])trails[sid].setLatLngs(ll);else trails[sid]=L.polyline(ll,{color:"#f59e0b",weight:4,opacity:.85,lineJoin:"round"}).addTo(LMAP);});
}
function addTrailPoint(sid,lat,lng){
  sid=String(sid);if(!LMAP||state.adminTab!=="map"||lat==null)return;
  if(trails[sid])trails[sid].addLatLng([lat,lng]);
  else trails[sid]=L.polyline([[lat,lng]],{color:"#f59e0b",weight:4,opacity:.85,lineJoin:"round"}).addTo(LMAP);
}
/* glide the marker to its new spot instead of jumping */
function animateMarker(m,to,ms=900){
  const from=m.getLatLng();if(Math.abs(from.lat-to[0])<1e-7&&Math.abs(from.lng-to[1])<1e-7)return;
  if(m._anim)cancelAnimationFrame(m._anim);const t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    m.setLatLng([from.lat+(to[0]-from.lat)*e,from.lng+(to[1]-from.lng)*e]);m._anim=k<1?requestAnimationFrame(step):null;};
  m._anim=requestAnimationFrame(step);
}
function onLiveMove(id){
  const s=state.shifts.find(x=>String(x.id)===String(id));if(!s)return;
  if(LMAP&&state.adminTab==="map"&&s.status==="ACTIVE"&&passFilter(s)){
    const m=liveMarkers[s.id];
    if(!m)addLiveMarker(s);
    else if(s.liveLat!=null){
      animateMarker(m,[s.liveLat,s.liveLng]);
      const st=isStale(s);if(st!==m._stale){m.setIcon(liveIcon(driverById(s.driverId)?.name,st));m._stale=st;}
    }
    if(String(state.follow)===String(s.id)&&s.liveLat!=null)LMAP.panTo([s.liveLat,s.liveLng],{animate:true,duration:.8});
  }
  refreshLivePanelSoon();
}
function followShift(id){
  state.follow=String(state.follow)===String(id)?null:id;refreshLivePanel();

}

function summaryData(id,from,to){

  const ordersC=shifts.reduce((a,s)=>a+(s.ordersCancelled||0),0);

  return {shifts,done,kmv,ordersD,ordersC,fuel,fk,eff:fk>0?(kmv/fk).toFixed(1):"—"};

  if(end<sh.startOdo)return toast("End KM can't be less than start ("+km(sh.startOdo)+"). Check the reading.");
  if(!photoBuf.odoout)return toast("Take the odometer photo first (camera).");
  if(!state.gps.logout&&gpsBusy.logout){const b0=$('[data-act="confirmEndDuty"]');if(b0){b0.disabled=true;b0.textContent="Waiting for location…";}await gpsWait.logout;if(b0){b0.disabled=false;b0.textContent="Confirm & Clock Out";}}
  if(!state.gps.logout)return toast(gpsMsg.logout||"No location yet — tap GPS to retry, or pick a Hub.");
  const btn=$('[data-act="confirmEndDuty"]');if(btn){btn.disabled=true;btn.textContent="Uploading…";}
  try{
    const g=state.gps.logout;const mins=Math.max(1,Math.round((Date.now()-sh.startedAt)/60000));
    const photoUrl=await uploadPhoto(photoBuf.odoout,`odo/${d.id}-out-${Date.now()}.jpg`);
    await rpc("driver_end_shift",{p_token:state.token,p_shift:String(sh.id),p:{end_odo:end,orders_done:+$("#edDone").value||0,orders_cancelled:+$("#edCanc").value||0,photo:photoUrl,time:g.time,place:g.place,addr:g.addr,lat:g.lat,lng:g.lng,src:g.src||"gps",summary:$("#edNote").value}});
    if(live.queue.length)await flushQueue();
    stopLiveWatch();delete photoBuf.odoout;state.gps.logout=null;closeModal();toast("Duty completed — clocked out ✓");await loadDriver();render();
  }catch(e){toast("Clock-out failed: "+(e.message||e));if(btn){btn.disabled=false;btn.innerHTML=ic('stop','i-xs')+" Confirm & Clock Out";}}
}
async function doSaveFuel(){
  const d=driverById(state.driverId);const sh=activeShift(d.id);
  const cost=+$("#fuCost").value;if(!cost||cost<=0)return toast("Enter the fuel amount in KWD.");
  if(!photoBuf.receipt)return toast("Take the receipt photo first (camera).");
  if(!state.gps.fuel&&gpsBusy.fuel){const b0=$('[data-act="saveFuel"]');if(b0){b0.disabled=true;b0.textContent="Waiting for location…";}await gpsWait.fuel;if(b0){b0.disabled=false;b0.textContent="Save Fuel";}}
  if(!state.gps.fuel)return toast(gpsMsg.fuel||"No location yet — tap GPS to retry, or pick a Hub.");
  const btn=$('[data-act="saveFuel"]');if(btn){btn.disabled=true;btn.textContent="Uploading…";}
  try{
    const g=state.gps.fuel;
    const photoUrl=await uploadPhoto(photoBuf.receipt,`receipt/${d.id}-${Date.now()}.jpg`);
    const data=await rpc("driver_add_fuel",{p_token:state.token,p:{station:$("#fuStation").value,cost,photo:photoUrl,place:g.place,lat:g.lat,lng:g.lng,time:nowTime()}});
    const mf=mapFuel(data);if(!state.fuelRecords.find(x=>x.id===mf.id))state.fuelRecords.push(mf);
    delete photoBuf.receipt;state.gps.fuel=null;closeModal();toast("Fuel refill saved ✓");render();
  }catch(e){toast("Fuel save failed: "+(e.message||e));if(btn){btn.disabled=false;btn.innerHTML=ic('check','i-xs')+" Save Fuel";}}
}
async function doDeleteDriver(id){if(!confirm("Remove this driver and ALL their records?"))return;await sb.from("driver_sessions").delete().eq("driver_id",String(id));const {error}=await sb.from("drivers").delete().eq("id",id);if(error){toast("Error: "+error.message);return;}await loadAll();toast("Driver removed");render();}
async function doResetDevice(id){const d=driverById(id);if(!confirm(`Reset ${d.name}'s device login? They can then sign in on a new phone.`))return;const {error}=await sb.from("drivers").update({active_device:null}).eq("id",id);if(error){toast("Error: "+error.message);return;}await sb.from("driver_sessions").delete().eq("driver_id",String(id));d.activeDevice=null;toast("Device reset — driver can log in on a new phone.");render();}
function exportCsv(rows,fn){const csv=rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=fn;a.click();toast("Exported "+fn);}
function doExportAll(){const rows=[["Date","Driver","Plate","Platform","Status","Start ODO","End ODO","Distance KM","Orders Done","Orders Cancel","Login","Logout","Duration"]];
  state.shifts.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(s=>{const d=driverById(s.driverId);rows.push([s.date,d?.name,d?.plate,s.platform,s.status,s.startOdo,s.endOdo??"-",s.distance??"-",s.ordersDone??"-",s.ordersCancelled??"-",s.loginPlace,s.logoutPlace||"pending",s.duration||"-"]);});exportCsv(rows,"sumou-shifts.csv");}
function doExportKm(){const rows=[["Date","Driver","Plate","Platform","Start ODO","End ODO","Distance KM","Orders Done","Orders Cancel"]];
  completedShifts().slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(s=>{const d=driverById(s.driverId);rows.push([s.date,d?.name,d?.plate,s.platform,s.startOdo,s.endOdo,s.distance,s.ordersDone??"-",s.ordersCancelled??"-"]);});exportCsv(rows,"sumou-km.csv");}
function doExportSummary(id){const from=$("#sumFrom").value,to=$("#sumTo").value,d=driverById(id),s=summaryData(id,from,to);
  const rows=[["Driver",d.name],["Plate",d.plate],["Range",from+" to "+to],["Total KM",s.kmv],["Shifts",s.done.length],["Orders Done",s.ordersD],["Orders Cancelled",s.ordersC],["Fuel KWD",money(s.fk)],["Efficiency KM/KD",s.eff],[],["Date","Platform","Distance KM","Orders Done","Orders Cancel","Status"]];
  s.shifts.forEach(x=>rows.push([x.date,x.platform,x.status==="COMPLETED"?x.distance:"-",x.ordersDone??"-",x.ordersCancelled??"-",x.status]));exportCsv(rows,`sumou-${(d.name||"driver").replace(/\s+/g,"_")}.csv`);}

async function claimDevice(driver){
  const my=deviceId();let cur=driver.activeDevice;
  try{const {data}=await sb.from("drivers").select("active_device").eq("id",driver.id).single();if(data)cur=data.active_device;}catch(e){}
  if(cur&&cur!==my)return false;
  try{await sb.from("drivers").update({active_device:my}).eq("id",driver.id);driver.activeDevice=my;}catch(e){}
  return true;
}

/* ============================================================ EVENTS ============================================================ */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-tab],[data-dtab],[data-plat],[data-mplat],[data-camkey],[data-deldriver],[data-reset],[data-summary],[data-sumexport],[data-gpsdetect],[data-hubstoggle],[data-hubpick],[data-map],[data-photo],[data-close],[data-zclose],[data-follow],[data-forceend]");
  if(!t)return;
  if(t.hasAttribute("data-close")){closeModal();return;}
  if(t.dataset.photo){openZoom(t.dataset.photo);return;}
  if(t.dataset.follow){followShift(t.dataset.follow);return;}
  if(t.dataset.forceend){doForceEnd(t.dataset.forceend);return;}
  if(t.dataset.camkey){const inp=$("#cam-"+t.dataset.camkey);if(inp)inp.click();return;}
  if(t.dataset.dtab){state.driverTab=t.dataset.dtab;render();return;}
  if(t.dataset.plat){state.selectedPlatform=t.dataset.plat;document.querySelectorAll(".dispatch-strip .btn-p").forEach(b=>b.classList.toggle("active",b.dataset.plat===t.dataset.plat));return;}
  if(t.dataset.mplat){state.mplat=t.dataset.mplat;document.querySelectorAll("[data-mplat]").forEach(b=>b.classList.toggle("active",b.dataset.mplat===t.dataset.mplat));return;}
  if(t.dataset.tab){state.adminTab=t.dataset.tab;document.querySelectorAll(".admin-tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t.dataset.tab));paintAdmin();return;}
  if(t.dataset.deldriver){doDeleteDriver(t.dataset.deldriver);return;}
  if(t.dataset.reset){doResetDevice(t.dataset.reset);return;}
  if(t.dataset.summary){modalSummary(t.dataset.summary);return;}
  if(t.dataset.sumexport){doExportSummary(t.dataset.sumexport);return;}
  if(t.dataset.map){const[la,ln]=t.dataset.map.split(",");if(la&&la!=="null")window.open(`https://www.openstreetmap.org/?mlat=${la}&mlon=${ln}#map=15/${la}/${ln}`,"_blank");return;}
  if(t.dataset.gpsdetect){detectGps(t.dataset.gpsdetect);return;}
  if(t.dataset.hubstoggle){const m=$("#hubs-"+t.dataset.hubstoggle);if(m)m.classList.toggle("hidden");return;}
  if(t.dataset.hubpick){const[k,i]=t.dataset.hubpick.split(":");setHubGps(k,+i);return;}
  const a=t.dataset.act;if(!a)return;
  switch(a){
    case "adminLogin":{const err=$("#adminErr");const show=m=>{if(err){err.textContent=m;err.classList.remove("hidden");}else toast(m);};
      const email=($("#adminEmail").value||"").trim(),pw=$("#adminPass").value;
      if(!email||!pw){show("Enter your admin email and password.");break;}
      t.disabled=true;
      const {error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error){t.disabled=false;show(/invalid/i.test(error.message)?"Wrong email or password.":error.message);break;}
      if(!(await checkAdmin())){await sb.auth.signOut();t.disabled=false;show("This account is not an admin.");break;}
      try{await enterAdmin();}catch(e){t.disabled=false;show("Could not load data: "+(e.message||e));}
      break;}
    case "driverLogin":{const err=$("#loginErr");const ph=digitsOnly($("#dlPhone").value),pin=$("#dlPin").value;
      const fail=m=>{if(err){err.textContent=m;err.classList.remove("hidden");}else toast(m);};
      if(ph.length<4){fail("Enter your phone number.");break;}
      if(!/^\d{4}$/.test(pin)){fail("Enter your 4-digit PIN.");break;}
      t.disabled=true;
      const {data,error}=await sb.rpc("driver_login",{p_phone:ph,p_pin:pin,p_device:deviceId()});
      if(error){t.disabled=false;fail("Sign-in failed: "+error.message);break;}
      if(data&&data.error){t.disabled=false;fail({NO_ACCOUNT:"No account found for this phone number.",BAD_PIN:"Incorrect PIN.",LOCKED:"Too many wrong PINs. Try again in 15 minutes.",DEVICE_LOCKED:"This driver is already logged in on another phone. Ask admin to reset the device.",BAD_PHONE:"Enter your phone number."}[data.error]||data.error);break;}
      state.token=data.token;state.screen="driver";
      try{await loadDriver();}catch(e){t.disabled=false;state.token=null;state.screen="landing";fail("Could not load your data: "+(e.message||e));break;}
      const d=driverById(state.driverId);state.driverTab="home";state.selectedPlatform=(d&&d.platforms&&d.platforms[0])||null;
      saveSession({role:"driver",token:data.token,dev:deviceId()});render();break;}
    case "logout":{
      if(state.screen==="admin"){unsubscribeRealtime();stopAdminPoll();try{await sb.auth.signOut();}catch(e){}
        state.drivers=[];state.shifts=[];state.fuelRecords=[];state.follow=null;mapView=null;state.screen="landing";render();break;}
      stopLiveWatch();if(state.token){try{await sb.rpc("driver_logout",{p_token:state.token});}catch(e){}}
      clearSession();state.token=null;state.screen="landing";state.driverId=null;state.gps={};state.selectedPlatform=null;state.drivers=[];state.shifts=[];state.fuelRecords=[];render();break;}
    case "gpsGauge":{const sh=activeShift(state.driverId);if(sh){startLiveWatch(sh.id);if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{const c=p.coords;onFix(c.latitude,c.longitude,c.accuracy,c.heading,c.speed);},e=>{},{enableHighAccuracy:true,timeout:12000});toast("Refreshing live location…");}else detectGps("login");break;}
    case "openStartDuty":modalStartDuty();break;
    case "startDuty":doStartDuty();break;
    case "openEndDuty":modalEndDuty();break;
    case "confirmEndDuty":doEndDuty();break;
    case "openFuel":{if(!activeShift(state.driverId)){toast("Clock in first to log fuel.");break;}modalFuel();break;}
    case "saveFuel":doSaveFuel();break;
    case "openAddDriver":modalAddDriver();break;
    case "saveDriver":doAddDriver();break;
    case "exportCsv":doExportAll();break;
    case "exportKm":doExportKm();break;
    case "reload":toast("Refreshing…");loadAll().then(render);break;
  }
});
document.addEventListener("change",e=>{
  if(e.target.classList&&e.target.classList.contains("cam")){onCam(e.target);return;}
  if(e.target.id==="fDriver"){state.filters.driver=e.target.value;paintAdmin();}
  if(e.target.id==="fPlatform"){state.filters.platform=e.target.value;paintAdmin();}
  if(e.target.id==="fStatus"){state.filters.status=e.target.value;paintAdmin();}});
document.addEventListener("input",e=>{if(e.target.id==="fSearch"){state.filters.search=e.target.value;paintAdmin();}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="dlPin"||e.target.id==="dlPhone"){const b=$('[data-act="driverLogin"]');if(b)b.click();}if(e.target.id==="adminPass"){const b=$('[data-act="adminLogin"]');if(b)b.click();}});

/* ============================================================ BOOT ============================================================ */
(async function boot(){
  try{
    if(isAdminGate()){
      state.ready=true;
      const {data}=await sb.auth.getSession();
      if(data&&data.session&&await checkAdmin()){await enterAdmin();return;}
      state.screen="landing";render();return;
    }
    state.ready=true;
    const sess=loadSession();
    if(sess&&sess.role==="driver"&&sess.token){
      state.token=sess.token;state.screen="driver";
      try{await loadDriver();
        if(!state.driverId)throw new Error("SESSION_EXPIRED");
        const d=driverById(state.driverId);state.driverTab="home";state.selectedPlatform=((d&&d.platforms)||[])[0]||null;}
      catch(e){state.token=null;state.screen="landing";clearSession();
        if(/SESSION_EXPIRED/.test((e&&e.message)||""))setTimeout(()=>toast("Please sign in again."),300);else throw e;}
    }
    render();
  }catch(err){
    console.error(err);
    app.innerHTML=`<div class="authgate"><div class="authcard"><div class="authbrand"><div class="logo-box">${ic('truck','i-lg')}</div><div class="ab-text"><b>SUMOU FLEET</b><small>Connection error</small></div></div>
      <div class="autherr" style="display:block">Could not connect to the database. Make sure step1-setup.sql was run in Supabase, then retry.<br><br><b>Error:</b> ${(err&&err.message)||err}</div>
      <button class="btn btn-amber btn-block" style="height:44px" onclick="location.reload()">Retry</button></div></div>`;
  }
})();
</script>
